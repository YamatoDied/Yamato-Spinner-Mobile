/* ===== YD 3.41: LEADERBOARD tab (RATING) ===== */
.lb-me{margin:0 0 10px;padding:9px 11px;border:1px solid rgba(var(--a),.4);border-radius:10px;background:rgba(var(--a),.09);font-size:12px;letter-spacing:.04em;color:var(--accent);font-variant-numeric:tabular-nums;word-break:break-word}
.lb-list{display:flex;flex-direction:column;gap:3px}
.lb-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 10px;border:1px solid rgba(var(--t),.08);border-radius:9px;background:rgba(var(--t),.03);font-size:12px;font-variant-numeric:tabular-nums}
.lb-row.me{border-color:rgba(var(--a),.7);background:rgba(var(--a),.18)}
.lb-row.gap{margin-top:8px}
.lb-rk{color:rgba(var(--t),.55);font-size:11px}
.lb-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.lb-v{color:var(--warm);font-weight:700;white-space:nowrap}
.lb-row.top1{border-color:#e8c34a}.lb-row.top1 .lb-rk{color:#e8c34a;font-weight:700}
.lb-row.top2{border-color:#c4ccd6}.lb-row.top2 .lb-rk{color:#c4ccd6;font-weight:700}
.lb-row.top3{border-color:#c98a56}.lb-row.top3 .lb-rk{color:#c98a56;font-weight:700}
.lb-empty{padding:18px 8px;text-align:center;font-size:12px;color:rgba(var(--t),.55)}
.lb-foot{margin:10px 0 2px;font-size:10.5px;line-height:1.5;color:rgba(var(--t),.5)}
.lb-sub{margin-top:14px}
.lb-nick{display:flex;gap:6px}
.lb-nick input{flex:1;min-width:0;padding:9px 11px;border:1px solid rgba(var(--t),.22);border-radius:10px;background:rgba(var(--t),.06);color:var(--text);font:inherit;font-size:13px;letter-spacing:.04em;outline:none}
.lb-nick input:focus{border-color:rgba(var(--a),.75);box-shadow:0 0 0 2px rgba(var(--a),.18)}
.lb-set{padding:0 16px;border:1px solid rgba(var(--a),.6);border-radius:10px;background:rgba(var(--a),.2);color:var(--accent);font:inherit;font-size:11px;font-weight:700;letter-spacing:.14em;cursor:pointer}
.lb-set:hover{background:rgba(var(--a),.38)}
.lb-msg{margin:7px 0 4px;min-height:14px;color:var(--warm)}
.sp-popup .wide-btn.lb-off{opacity:.65}

/* ===== YD 3.41: STABLE LAYOUT (see lockLayout in script.js): the clock block keeps its size when parts of it are hidden, so nothing else moves ===== */
.hero{position:relative}
body:not(.lock-off) .hero{min-height:var(--hero-h,0px)}
body:not(.lock-off) .hero-copy{min-width:var(--hc-w,0px)!important}   /* 3.42: only the WIDTH is reserved; the card hugs its content in height again (the hero slot above keeps the height, so the panels still do not move) */
body.no-analog.move-mode .clock-wrap{position:absolute}   /* the switched-off analog clock is shown in MOVE mode only as a ghost: it must not push the other elements */

/* ===== YD 3.41: MUSIC REACTION (see music.js) ===== */
.mx-bars{position:fixed;left:0;bottom:0;width:100%;z-index:2;pointer-events:none}
.mx-edge{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;box-shadow:inset 0 0 90px 4px rgba(var(--mxc,115,168,212),.8),inset 0 0 6px 1px rgba(var(--mxc,115,168,212),.9);transition:opacity .09s linear}

/* 3.51: rating and settings icons in the popup header */

.sp-pop-ic.on{color:var(--accent);border-color:var(--accent);background:rgba(var(--a),.2)}

/* 3.52: prestige points and the tree */
.sp-pt-sum{margin:2px 0 8px;font-weight:700;color:var(--warm);letter-spacing:.04em}
.sp-tree{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}

.sp-pt-n{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"n l c" "d d d";gap:1px 8px;align-items:center;text-align:left;padding:7px 9px;border:1px solid rgba(var(--t),.14);border-left:3px solid rgba(var(--t),.25);border-radius:9px;background:rgba(var(--t),.035);color:inherit;font:inherit;cursor:pointer}

.sp-pt-n.on{border-left-color:var(--warm)}.sp-pt-n.can{background:rgba(var(--t),.09)}
.sp-pt-n.lock,.sp-pt-n.max{opacity:.55;cursor:default}

.sp-pt-tog.on{border-color:var(--warm)}
.sp-empty{margin-top:8px}

.sp-wipe.sure{background:#c0152f;color:#fff;border-color:#ff4d6d}
/* 3.61: ADMIN TOOLS (test mode, nothing is saved) */

const SP_SKIN_MASK = Math.pow(2, SP_SKINS.length) - 1;   // 3.57: NOT a 32-bit mask any more (the skins passed 31): plain numbers, bit i = Math.pow(2, i); up to 52 skins fit in one saved number
const spBit = i => Math.pow(2, i);
const spHasBit = (m, i) => Math.floor((m || 0) / spBit(i)) % 2 === 1;
/* 3.57 RARITY: 0 common, 1 rare, 2 epic, 3 legendary, 4 mythic (by price), 5 special (given for an achievement, cannot be bought). 3.6: ONLY the special skins are ETERNAL (not lost by a prestige); the mythic ones are reset like all the others. */
const SP_RAR_COL = ['#9aa7b5', '#4da3ff', '#b36bff', '#ffb830', '#ff4d6d', '#2dffb0'], SP_RAR_KEYS = ['rCommon', 'rRare', 'rEpic', 'rLegend', 'rMythic', 'rSpecial'];
const spRarOf = s => s.ach ? 5 : s.price < 1.5e7 ? 0 : s.price <= 1.5e9 ? 1 : s.price <= 4e11 ? 2 : s.price < 1.5e14 ? 3 : 4;   // 3.6: thresholds moved with the new prices (same skins in the same rarity as before)
SP_SKINS.forEach(s => { if (s.b.max) s.b.res = Math.round(s.b.max * 50) / 100; });   // 3.64: every skin that adds top speed adds HALF of it to the resonance bonus (Omega: top speed +280%, resonance bonus +140%)
SP_SKINS.forEach(s => { s.r = spRarOf(s); s.eter = s.r >= 5; });   // 3.6: ONLY the special (achievement) skins are eternal; mythic ones are reset by a prestige like all the others
const spAchOk = (P, s) => !!s.ach && ((s.ach.k === 'pres' ? spPres(P) : (P.tot || 0)) >= s.ach.n);   // 3.57: the condition of an achievement skin (prestiges made / turns of all time)
const spOwns = (P, i) => { const s = SP_SKINS[i]; return !!s && (spHasBit(P.skins, i) || spAchOk(P, s)); };
const spKeepMask = P => SP_SKINS.reduce((m, s, i) => m + (i > 0 && s.eter && spHasBit(P.skins, i) ? spBit(i) : 0), 1);   // 3.57: the skins that survive a prestige
const spOrdKey = i => SP_SKINS[i].ach ? Infinity : SP_SKINS[i].price;   // 3.58: the special (achievement) skins go to the very end of the list
const SP_SKIN_ORDER = SP_SKINS.map((s, i) => i).sort((a, b) => (spOrdKey(a) === spOrdKey(b) ? 0 : spOrdKey(a) < spOrdKey(b) ? -1 : 1) || a - b);   // 3.43: the order of the cards on screen (cheapest first)
const SP_BN_KEYS = ['coin', 'max', 'kick', 'crit', 'drag', 'disc', 'res'];   // 3.64: + res (the resonance bonus)   // the bonus kinds a skin can have, in the order they are listed

/* ---------- formulas (P = the spinner object: state.spinner on the main page) ---------- */
const spPres = P => (P && P.pres) || 0;                                          // 3.36: prestiges made
/* 3.38: the bonus of every prestige depends on its price step (a step = 2 prestiges): the first two give x1, the next two x1.25, then x1.5 ... spPW(n) = the sum for n prestiges
   (so for n = 1, 2 it is 1, 2 as before; n = 3 -> 3.25, n = 4 -> 4.5, n = 6 -> 7.5 ...) */
const spPW = n => { const q = Math.floor(n / SP_PRES_DOUBLE), r = n - q * SP_PRES_DOUBLE; return SP_PRES_DOUBLE * q + SP_PRES_GROW * SP_PRES_DOUBLE * q * (q - 1) / 2 + r * (1 + SP_PRES_GROW * q); };
const spPCoin = n => 1 + SP_PRES_COIN * spPW(n), spPMax = n => 1 + SP_PRES_MAX * spPW(n), spPKick = n => 1 + SP_PRES_KICK * spPW(n);   // 3.36: prestige multipliers
const spPCoast = n => Math.pow(SP_PRES_COAST, spPW(n));                          // drag multiplier (smaller = coasts longer)
const spPDisc = n => 1 - Math.min(.5, SP_PRES_DISC * spPW(n));                   // price multiplier
const spPCrit = n => SP_PRES_CRIT * spPW(n);                                     // extra lucky turn chance
const spPGad = n => Math.max(SP_PRES_GAD_MIN, Math.pow(SP_PRES_GAD, spPW(n)));   // 3.47: timer multiplier of the gadgets (smaller = faster)
const spPGen = n => 1 + SP_PRES_GEN * spPW(n);                                   // 3.47: coin generator / coin rain multiplier
const spPStart = n => Math.round(SP_PRES_START * spPW(n));                       // 3.47: coins you start a run with

/* ---------- 3.52 PRESTIGE POINTS and the TREE: 1 prestige = 1 point; points are spent on the tree (levels are packed into ONE saved number pt, 3 bits per slot);
   a prestige (with the "return points" switch) or an EMPTY prestige returns all spent points. The ORDER of SP_TREE is the slot number: only append new nodes. ---------- */
const SP_PT_BASE = 8, SP_TREE_SLOTS = 16;   // 3.62: the tree is BUFFED: every node is ~50% stronger and the dear nodes are cheaper (old saves stay valid: the points spent can only go down)

<script>
/* Yamato Spinner MOBILE: there is no YamatoDesktop.exe on a phone, so the three requests the spinner window sends to the host
   (/__state, /__spwin, /__spwin/top) are answered here from localStorage. spinner-window.js and spinner-shared.js stay exactly the same as on the PC. */
(function () {
  'use strict';
  const KEY = 'ydSpinnerMobile.save', UIK = 'ydSpinnerMobile.ui', LK = 'ydSpinnerMobile.lang';
  const ls = {get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); return true; } catch (_) { return false; } }};
  let mem = null, frozen = false;   // mem: copy for when localStorage is blocked (private mode); frozen: an import is being applied, the page must not overwrite it on its way out
  const DEF_UI = {bg: '#2c4154', text: '#e7edf2', accent: '#73a8d4', warm: '#d99074', panel: '#08121c'};
  const parse = s => { try { const o = JSON.parse(s); return o && typeof o === 'object' ? o : null; } catch (_) { return null; } };
  function lang() {
    const q = /[?&]lang=(ua|en)/i.exec(location.search); if (q) ls.set(LK, q[1].toUpperCase());
    const s = ls.get(LK); if (s === 'UA' || s === 'EN') return s;
    return /^(uk|ru|be)/i.test(navigator.language || '') ? 'UA' : 'EN';
  }
  const load = () => parse(ls.get(KEY) || mem) || {};
  const ui = () => Object.assign({}, DEF_UI, parse(ls.get(UIK)) || {}, {lang: lang()});
  const reply = (o, status) => Promise.resolve(new Response(JSON.stringify(o), {status: status || 200, headers: {'Content-Type': 'application/json'}}));
  const realFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = function (url, opt) {
    const u = typeof url === 'string' ? url : (url && url.url) || '';
    if (u === '/__state') return reply({uiLang: lang(), spinner: load()});
    if (u === '/__spwin') {
      if (opt && opt.method === 'POST' && !frozen) { const o = parse(opt.body); if (o) { const s = JSON.stringify(o); mem = s; ls.set(KEY, s); } }
      return reply({top: false, ui: ui()});
    }
    if (u === '/__spwin/top') return reply({top: false});
    return realFetch ? realFetch(url, opt) : Promise.reject(new Error('offline'));
  };
  window.YDM = {
    lang,
    setLang(l) { ls.set(LK, l === 'EN' ? 'EN' : 'UA'); },
    exportText() { return JSON.stringify({spinner: load()}); },
    // accepts: the spinner numbers, {"spinner":{...}} or the whole state.json of the PC version (its colours and language are taken too)
    importText(text) {
      const o = parse(text); if (!o) return false;
      const sp = (o.spinner && typeof o.spinner === 'object') ? o.spinner : o;
      if (!sp || typeof sp !== 'object' || !('coins' in sp || 'pres' in sp || 'skins' in sp)) return false;
      const clean = typeof spSanitize === 'function' ? spSanitize(sp) : sp;
      frozen = true; mem = JSON.stringify(clean); ls.set(KEY, mem);
      const u = typeof o.ui === 'string' ? parse(o.ui) : o.ui; if (u && typeof u === 'object') ls.set(UIK, JSON.stringify(u));
      if (o.uiLang === 'UA' || o.uiLang === 'EN') ls.set(LK, o.uiLang);
      return true;
    }
  };
})();
</script>

<script>
'use strict';
/* Yamato Desktop YD 3.41 - LEADERBOARD (tab RATING in the spinner panel).
   Loaded by BOTH pages that show the spinner (index.html and spinner-window.html), after spinner-shared.js and leaderboard-config.js.
   The database is a GitHub repository (see leaderboard-config.js):
   - READING: leaderboard.json of the repository (raw.githubusercontent.com, no key needed). It holds every player: a hash of the secret id, the nickname,
     prestiges (p), turns of all time (t) and coins (c). The three tops are sorted here.
   - WRITING: the game cannot write to a repository without a key, so it opens an issue titled "LB" with its numbers (the key in leaderboard-config.js can ONLY create issues
     in that one repository). A GitHub Action in the repository checks the numbers, updates leaderboard.json and closes the issue (a minute or two).
   - NICKNAMES: automatic "player12345"; the player may choose his own (3-16 characters, letters / digits / _ / -, unique, not case sensitive). The repository decides who gets a name:
     the game checks the list first, the Action checks again. The nickname is stored inside the spinner object (a flat object of numbers: it is packed into two numbers, see lbPack).
   - The page that is "active" sends (the wallpaper widget, or the own window while it is open): at most once per 15 minutes and only when something changed; a prestige and a new nickname go sooner. */

const LB_VER = '3.41';
const LB_CS = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-';   // 64 characters, value 0 of a packed character = "end of the nickname"
const LB_NICK_RX = /^[A-Za-z0-9_-]{3,16}$/;

  t0: 0, hFor: '', h: '', sig: '', mounted: false, inited: false, sendErr: ''};
const lbCfg = () => (typeof window !== 'undefined' && window.LB_CFG) || {};
const lbP = () => (LB.hooks && LB.hooks.get()) || null;

/* ---------- the nickname packed into numbers (8 characters per number, 65 values per character: 0 = end, 1..64 = LB_CS) ---------- */
function lbPack(str) { let v = 0; for (let i = 0; i < 8; i++) v = v * 65 + (i < str.length ? LB_CS.indexOf(str[i]) + 1 : 0); return v; }

  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];

    for (let i = 16; i < 64; i++) { const a = w[i - 15], b = w[i - 2]; w[i] = (w[i - 16] + (rr(a, 7) ^ rr(a, 18) ^ (a >>> 3)) + w[i - 7] + (rr(b, 17) ^ rr(b, 19) ^ (b >>> 10))) | 0; }

/* ---------- who am I ---------- */
function lbRnd() {
  try { const a = new Uint32Array(2); crypto.getRandomValues(a); return (a[0] * 2097152 + (a[1] >>> 11)) % 8.9e15 + 1; } catch (_) {}

const lbIdStr = P => P.lbIdA + '-' + P.lbIdB;

const lbCustom = P => lbNickDec(P.lbNickA, P.lbNickB);
function lbMyH(P) {

  const id = lbIdStr(P); if (LB.hFor !== id) { LB.hFor = id; LB.h = lbSha(id).slice(0, 32); }

/* ---------- 3.45: where the panel opens: BESIDE the spinner (wide window) or UNDER it (narrow window); the button next to the pin chooses by hand ---------- */
let layPref = '';
try { layPref = localStorage.getItem('ydSpLay') || ''; } catch (_) {}
const SW_SIDE_MIN = 700;   // an unchosen layout goes to the side when the window is at least this wide (px)
const layNow = () => (layPref === 'side' || layPref === 'down') ? layPref : (window.innerWidth >= SW_SIDE_MIN ? 'side' : 'down');
function applyLayout() {

}
function toggleLayout() {

}

/* ---------- the panel under the spinner (stats, tabs UPGRADES / SKINS / SETTINGS): built by spinner-shared.js ---------- */
let popOpen = false;
function renderPopup() { if (loaded) spuiRender(P); }
function buy(id, mode) {
  const r = spDoBuy(P, id, mode);
  if (!r) { toast(spx('noCoins')); return; }
  dirty = true; renderCoins(); renderPopup(); draw();
  const row = r.u.el && r.u.el.row; if (row) { row.classList.remove('bought'); void row.offsetWidth; row.classList.add('bought'); }
  toast(spx('bought', {n: spx(SP_NAME[id]) + ' ' + spLv(P, r.u)}) + (r.free ? spx('freeBuy') : '')); push();
}
function hyBuy(id, mode) {   // 3.59: HYPERCHARGE
  const r = spDoHyBuy(P, id, mode);
  if (!r) { toast(spx('noCoins')); return; }
  dirty = true; renderCoins(); renderPopup(); draw();
  const row = r.u.el && r.u.el.row; if (row) { row.classList.remove('bought'); void row.offsetWidth; row.classList.add('bought'); }
  toast(spx('bought', {n: spx('hn_' + id) + ' ' + spHyLv(P.hy, r.u.i)})); push();
}
function pxBuy(id, mode) {   // 3.65: PARADOXES
  const r = spDoPxBuy(P, id, mode);
  if (!r) { toast(spx('noCoins')); return; }
  dirty = true; renderCoins(); renderPopup(); draw();
  const row = r.u.el && r.u.el.row; if (row) { row.classList.remove('bought'); void row.offsetWidth; row.classList.add('bought'); }

}
function miniAct(op, a, b) {   // 3.68: MINIS (the rules are in spMiniOp, spinner-shared.js; 3.69: + take off / equip / replace / throw away)
  const r = spMiniOp(P, op, a, b);
  if (!r.ok) { toast(spx(r.k)); return; }

  toast(spx(r.k, r.p)); push();
}
function buyAll(scope) {   // 3.62: UPGRADE ALL (the rules are in spDoBuyAll, spinner-shared.js)
  const r = spDoBuyAll(P, scope);
  if (!r) { toast(spx('noCoins')); return; }
  dirty = true; renderCoins(); renderPopup(); draw();
  r.ids.forEach(id => { const u = SP_UPS.concat(SP_HY).find(x => x.id === id), row = u && u.el && u.el.row; if (row) { row.classList.remove('bought'); void row.offsetWidth; row.classList.add('bought'); } });
  toast(spx('buyAllDone', {n: r.levels, c: spFmt(r.cost)})); push();
}
function pickSkin(i) {
  const r = spDoSkin(P, i);

  if (r === 'same') return;
  dirty = true; build(); renderCoins(); renderPopup(); draw();
  toast(spx(r === 'buy' ? 'skinBought' : 'skinSel', {n: spx(SP_SKINS[i].k)})); push();
}
function setType(ty) {

  P.type = ty; dirty = true; build(); draw(); renderPopup(); push();
}
function doPrestige() {   // 3.36: the reset itself is in spDoPrestige (spinner-shared.js); here the spinner is stopped, redrawn and sent to the host at once
  const r = spDoPrestige(P, SPX.refund);
  if (!r) return;

  build(); coinsShown = -1; spRateReset(); spGadgetsReset(); draw(); renderPopup();
  toast(spx('presDone', {n: r.pres, l: SP_LEGS[P.type]})); push(); if (r.hy) setTimeout(() => toast(spx('hyOpened')), 2200); if (r.px) setTimeout(() => toast(spx('pxOpened')), 2200); if (r.mini) setTimeout(() => toast(spx('miniOpened')), 2200);   // 3.59 / 3.68

}
/* 3.61 ADMIN TOOLS: the test mode (rules and the copy of the data: spinner-shared.js; push() sends the copy while it is on) */
function admEnter() {
  if (!loaded || !spAdminStart(P)) return;
  push(); renderPopup(); toast(spx('admOn'));
}
function admExit() {
  if (!window.ADMIN_SNAP) return;
  spAdminStop(P);
  w = 0; rev = 0; session = 0; motorUntil = 0; critUntil = 0; built = -1; dirty = true;
  build(); coinsShown = -1; spRateReset(); spGadgetsReset(); draw(); renderPopup(); toast(spx('admOff')); push();
}
function adm(id) {
  if (!loaded || !spAdminOn()) return;
  if (id === 'wmax') { w = spMaxW(P); start(); } else if (id === 'w0') w = 0; else if (!spAdminApply(P, id)) return;
  built = -1; build(); coinsShown = -1; draw(); renderPopup(); start();
}
function nodeBuy(id) {   // 3.52: one level of a tree node

  dirty = true; renderPopup(); push();

  spDoWipe(P);
  w = 0; rev = 0; session = 0; motorUntil = 0; critUntil = 0; built = -1; dirty = true;
  build(); coinsShown = -1; spRateReset(); spGadgetsReset(); draw(); renderPopup(); toast(spx('wipeDone')); push();
}
function doEmpty() {   // 3.52: empty prestige
  spDoEmpty(P);
  w = 0; rev = 0; session = 0; motorUntil = 0; critUntil = 0; built = -1; dirty = true;
  build(); coinsShown = -1; spRateReset(); spGadgetsReset(); draw(); renderPopup(); toast(spx('emptyDone')); push();

const SW_ACT = {adm, admEnter, admExit, mouse: () => { P.mouse = P.mouse ? 0 : 1; held = false; dirty = true; renderPopup(); push(); }, buy, hbuy: hyBuy, pbuy: pxBuy, mini: miniAct, buyall: buyAll, skin: pickSkin, type: setType, prestige: doPrestige, node: nodeBuy, empty: doEmpty, wipe: doWipe, rerender: renderPopup,
  changed: () => {}};
function togglePopup(force) {

  const pop = $('spPopup');
  pop.classList.toggle('open', popOpen); pop.setAttribute('aria-hidden', String(!popOpen));

/* ---------- talking to the host ---------- */
let busy = false, closing = false;
function applyUi(ui) {
  if (!ui) return;
  let o = ui; if (typeof ui === 'string') { try { o = JSON.parse(ui); } catch (_) { return; } }
  if (!o || typeof o !== 'object') return;
  if (o.lang === 'UA' || o.lang === 'EN') { if (lang !== o.lang) { lang = o.lang; document.documentElement.lang = lang === 'UA' ? 'uk' : 'en'; renderAll(); } }
  const hex = v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v), rgb = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
  if (hex(o.bg) && hex(o.text) && hex(o.accent) && hex(o.warm)) {
    const s = document.documentElement.style, bg = rgb(o.bg), lum = (.2126 * bg[0] + .7152 * bg[1] + .0722 * bg[2]) / 255;
    const pn = hex(o.panel) ? rgb(o.panel) : (lum > .55 ? bg.map(v => Math.min(255, v + 4)) : bg.map(v => Math.round(v * .4)));
    for (const k of ['bg', 'text', 'accent', 'warm']) s.setProperty('--' + k, o[k]);
    s.setProperty('--t', rgb(o.text).join(',')); s.setProperty('--a', rgb(o.accent).join(',')); s.setProperty('--p', pn.join(','));
  }
}
function applyHost(j) {
  if (!j) return;
  if (j.ui) applyUi(j.ui);
  if (typeof j.top === 'boolean') { pinned = j.top; const b = $('spPin'); b.classList.toggle('on', pinned); b.setAttribute('aria-pressed', String(pinned)); b.title = t(pinned ? 'pinOn' : 'pinOff'); }
}
function push(keep) {   // send our numbers to the host (it writes them into the settings file and the main page adopts them)
  if (!loaded) return Promise.resolve();
  dirty = false;
  return fetch('/__spwin', {method: 'POST', headers: Object.assign({'Content-Type': 'application/json'}, HDR), body: JSON.stringify(window.ADMIN_SNAP || P), keepalive: !!keep, cache: 'no-store'})   // 3.61: in the ADMIN test mode the numbers from BEFORE the test go to the host
    .then(r => r.ok ? r.json() : null).then(applyHost).catch(() => { dirty = true; });
}
function beat() {
  if (busy || closing || !loaded) return;
  busy = true; push().then(() => { busy = false; }, () => { busy = false; });
}
function togglePin() {
  fetch('/__spwin/top', {method: 'POST', headers: HDR, body: JSON.stringify({on: !pinned}), cache: 'no-store'}).then(r => r.ok ? r.json() : null).then(j => { applyHost(j); toast(t(pinned ? 'pinOn' : 'pinOff')); }).catch(() => {});
}

/* ---------- small helpers ---------- */
let toastTm = 0;
function toast(s) { const e = $('swToast'); e.textContent = s; e.classList.add('show'); clearTimeout(toastTm); toastTm = setTimeout(() => e.classList.remove('show'), 1800); }
function fit() {   // the whole look scales with the width of the window

  $('spTitle').textContent = t('title'); $('spCogLabel').textContent = t('cog'); $('spPin').title = t(pinned ? 'pinOn' : 'pinOff'); applyLayout();

/* ---------- input ---------- */
function wire() {
  const hub = $('spHub');
  hub.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    e.preventDefault();
    try { hub.setPointerCapture(e.pointerId); pointer = e.pointerId; } catch (_) {}
    held = true; heldAt = performance.now(); kick();
  });
  const release = e => { if (pointer !== null && e && e.pointerId !== undefined && e.pointerId !== pointer) return; held = spaceDown; pointer = null; };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => hub.addEventListener(ev, release));
  window.addEventListener('blur', () => { held = false; pointer = null; spaceDown = false; });
  hub.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); kick(); } });
  document.addEventListener('keydown', e => {   // SPACE anywhere in the window = click / hold the centre
    if (e.code !== 'Space' || e.repeat || !loaded) return;
    const tg = e.target; if (tg && (tg.tagName === 'BUTTON' || tg.tagName === 'INPUT') && tg !== hub) return;
    e.preventDefault(); spaceDown = true; held = true; heldAt = performance.now(); kick();

  document.addEventListener('keyup', e => { if (e.code === 'Space') { spaceDown = false; if (pointer === null) held = false; } });
  $('spStage').addEventListener('contextmenu', e => e.preventDefault());
  spMouseWire($('spStage'), {   // 3.55: spin by dragging the mouse in circles
    on: () => !!P.mouse, ok: () => loaded,
    center: () => { const r = $('spHub').getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.top + r.height / 2}; },
    add: d => { w = spMouseGain(P, w, d); start(); },
    end: () => { if (P.upMotor) motorUntil = performance.now() + spMotorMs(P.upMotor, P); start(); }
  });
  $('spCog').addEventListener('click', () => togglePopup());
  $('spPopClose').addEventListener('click', () => togglePopup(false));
  $('spPin').addEventListener('click', togglePin);
  $('spLay').addEventListener('click', toggleLayout);
  window.addEventListener('resize', () => { fit(); applyLayout(); });
  window.addEventListener('pagehide', () => { closing = true; push(true); });   // the window is closing: the last numbers go out in a request that survives the page
  document.addEventListener('visibilitychange', () => { if (document.hidden) beat(); });
  setInterval(beat, 1000);
}

/* ---------- start ---------- */
function failMsg() { const e = $('swLoad'); e.textContent = t('failed'); }
function init(tries) {
  Promise.all([
    fetch('/__state', {headers: HDR, cache: 'no-store'}).then(r => r.ok ? r.json() : Promise.reject(new Error('state'))),
    fetch('/__spwin', {headers: HDR, cache: 'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null)
  ]).then(([st, host]) => {
    if (st && (st.uiLang === 'UA' || st.uiLang === 'EN')) { lang = st.uiLang; document.documentElement.lang = lang === 'UA' ? 'uk' : 'en'; }
    P = spSanitize(st && st.spinner);

    loaded = true;

    spuiMount($('spPopup'), false, SW_ACT); spResMount($('spinnerWidget')); spSparkMount($('spStage')); wire(); applyLayout(); fit(); renderAll(); draw();
    $('swLoad').classList.add('hide');
    setTimeout(fit, 300);
    push();
  }).catch(() => {
    if (tries < 6) setTimeout(() => init(tries + 1), 600 * (tries + 1)); else failMsg();
  });
}
$('swLoad').textContent = t('loading');
init(0);

    EN: {title: 'SAVE DATA', hint: 'Your progress is kept in this browser. To move it to another device copy the text below. To load progress here, paste a save text (or the whole state.json of the PC version: %LOCALAPPDATA%\\YamatoDesktop) and press LOAD.',
