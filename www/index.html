<!-- YD 3.37 (3.34): the spinner in its own window. Opened by the host (YamatoDesktop.exe) in a small always-on-top browser window; see spinner-window.js.
     It re-uses style.css (the spinner look and skins, the panel, buttons, bars) and spinner-shared.js (the rules and the panel), and only overrides the placement. -->
<style>
*{box-sizing:border-box}
:root{--bg:#2c4154;--text:#e7edf2;--accent:#73a8d4;--panel:#08121c;--warm:#d99074;--font:Consolas,"SFMono-Regular","Courier New",monospace}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}
body{user-select:none}.wallpaper{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--bg);transition:background-color .55s ease}
.static-text{position:absolute;left:4.2%;top:5.5%;z-index:8;font-size:14px;letter-spacing:.15em;color:rgba(var(--t),.58);white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:10px;background:var(--accent);box-shadow:0 0 14px rgba(var(--a),.6)}
main{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,5vh,60px);pointer-events:none}main>*{pointer-events:auto}
.hero{display:flex;align-items:center;justify-content:center;gap:clamp(32px,8vw,150px)}
.hero-copy{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.clock{font-size:clamp(64px,6.5vw,100px);font-weight:300;--ls:.035em;line-height:.95;color:var(--text)}
.date{margin-top:17px;font-size:15px;--ls:.19em;color:rgba(var(--t),.62)}
.code-card{margin-top:40px;font-size:clamp(14px,1.05vw,19px);line-height:1.83;color:var(--text);opacity:.9}.code-card span{color:var(--warm)}.indent{padding-left:38px}
.clock-wrap{display:flex;justify-content:center}.analog-clock{position:relative;width:min(24vw,340px);aspect-ratio:1;border:2px solid rgba(var(--t),.76);border-radius:50%;box-shadow:0 0 34px rgba(var(--a),.18),inset 0 0 45px rgba(0,0,0,.1);transition:transform .65s cubic-bezier(.2,.75,.2,1)}
.analog-clock:before{content:"";position:absolute;inset:12%;border:1px solid rgba(var(--t),.09);border-radius:50%}.tick{position:absolute;left:50%;top:8%;width:2px;height:12px;background:rgba(var(--t),.65)}.tick-3{top:50%;left:auto;right:8%;width:12px;height:2px;transform:translateY(-50%)}.tick-6{top:auto;bottom:8%;width:2px;height:12px}.tick-9{top:50%;left:8%;width:12px;height:2px;transform:translateY(-50%)}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:4px}.hour-hand{height:25%;width:5px;background:var(--text);transform:translateX(-50%)}.minute-hand{height:34%;width:4px;background:var(--text);transform:translateX(-50%)}.second-hand{height:38%;width:2px;background:var(--warm);transform:translateX(-50%)}.hub{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);background:var(--text)}
.bottom-grid{width:86vw;display:flex;flex-direction:row;flex-wrap:nowrap;gap:1.2vw;align-items:center;justify-content:center;overflow:visible}
.panel{flex:0 1 var(--panel-width,31%);width:var(--panel-width,31%);height:var(--panel-height,195px);min-width:0;border:1px solid rgba(var(--t),.10);background:rgba(var(--p),.22);padding:var(--panel-pad,18px 20px);box-shadow:inset 0 0 40px rgba(var(--t),.012),0 14px 36px rgba(0,0,0,.08);overflow:hidden;transition:width .48s cubic-bezier(.2,.75,.2,1),height .48s cubic-bezier(.2,.75,.2,1),padding .48s ease,background-color .48s ease}
.panel-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.19em;color:var(--accent);padding-bottom:13px;border-bottom:1px solid rgba(var(--t),.07)}.panel-code{color:rgba(var(--t),.30);font-size:10px}
.note-display{margin-top:19px;font-size:16px;line-height:1.58;color:rgba(var(--t),.92);min-height:66px;white-space:pre-wrap;word-break:break-word}.progress-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:17px;margin-top:19px}.metric{min-width:0}.metric>div:first-child{display:flex;justify-content:space-between;gap:7px;font-size:12px;letter-spacing:.13em;color:rgba(var(--t),.5)}.metric b{font-size:13px;font-weight:400;color:var(--text)}.bar{height:3px;background:rgba(var(--t),.10);margin-top:9px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:var(--accent);transition:width .75s cubic-bezier(.2,.75,.2,1)}.day-counter{margin-top:18px;font-size:11px;letter-spacing:.12em;color:rgba(var(--t),.34)}
.media-body{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:12px;margin-top:18px}.album{width:52px;height:52px;border:1px solid rgba(var(--t),.11);display:grid;place-items:center;color:var(--accent);font-size:21px;background:rgba(var(--p),.18);overflow:hidden;border-radius:2px}.album img{width:100%;height:100%;object-fit:cover}.media-main{min-width:0}.track{font-size:14px;color:rgba(var(--t),.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{margin-top:6px;font-size:11px;color:rgba(var(--t),.40);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.media-controls{display:flex;align-items:center;gap:5px}.media-controls button{width:31px;height:30px;border:1px solid rgba(var(--t),.12);background:rgba(var(--t),.025);color:rgba(var(--a),.45);font:14px var(--font);cursor:not-allowed;opacity:.55}.equalizer{display:flex;align-items:end;gap:3px;height:15px;margin-top:13px;opacity:.72}.equalizer i{width:2px;height:25%;background:var(--accent);animation:none}@keyframes beat{0%{height:20%;transform:scaleY(.72)}50%{height:75%;transform:scaleY(1)}100%{height:95%;transform:scaleY(.78)}}.equalizer.playing i{animation:beat .9s ease-in-out infinite}.equalizer.playing i:nth-child(2){animation-delay:-.2s}.equalizer.playing i:nth-child(3){animation-delay:-.5s}.equalizer.playing i:nth-child(4){animation-delay:-.1s}.equalizer.playing i:nth-child(5){animation-delay:-.35s}.equalizer.playing i:nth-child(6){animation-delay:-.6s}.equalizer.playing i:nth-child(7){animation-delay:-.28s}.equalizer.playing i:nth-child(8){animation-delay:-.45s}
.moveable{transform:translate(var(--move-x,0),var(--move-y,0))}.custom-label{position:absolute;z-index:5;font-size:13px;letter-spacing:.15em;color:rgba(var(--t),.54);white-space:nowrap;transition:opacity .35s ease}.custom-label[data-key="custom1"]{left:4.2%;top:28%}.custom-label[data-key="custom2"]{right:4.2%;top:28%}.custom-label[data-key="custom3"]{left:50%;top:17%;transform:translate(calc(-50% + var(--move-x,0)),var(--move-y,0))}

.open-editor{position:absolute;z-index:30;right:2.4%;top:50%;transform:translateY(-50%);border:1px solid rgba(var(--a),.24);background:rgba(var(--p),.38);color:var(--accent);font:12px var(--font);letter-spacing:.14em;padding:10px 13px;border-radius:4px;cursor:pointer;opacity:.48;backdrop-filter:blur(4px);transition:opacity .3s ease,transform .3s ease,background-color .3s ease}.open-editor:hover{opacity:.85;background:rgba(var(--p),.58)}
.editor-overlay{position:fixed;inset:0;z-index:100;display:flex;visibility:hidden;opacity:0;transition:opacity .4s ease,visibility 0s .4s;background:rgba(0,0,0,.64);backdrop-filter:blur(8px);align-items:center;justify-content:center}.editor-overlay.open{visibility:visible;opacity:1;transition:opacity .4s ease}.editor-shell{width:min(1000px,94vw);height:min(720px,92vh);transform:translateY(22px) scale(.97);transition:transform .5s cubic-bezier(.2,.8,.2,1);position:relative;background:#10171e;border:1px solid rgba(255,255,255,.13);box-shadow:0 25px 80px rgba(0,0,0,.5);color:#eaf0f4;display:flex;flex-direction:column;overflow:hidden}
.editor-head{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid rgba(255,255,255,.08);flex:none}.editor-kicker{font-size:10px;letter-spacing:.18em;color:#6e9cc2}.editor-title{font-size:22px;margin-top:5px}.header-actions{display:flex;align-items:center;gap:12px}.language-switch{display:flex;border:1px solid rgba(255,255,255,.10);overflow:hidden}.lang-btn{width:45px;height:33px;border:0;background:#0c141b;color:rgba(255,255,255,.45);font:11px var(--font);cursor:pointer}.lang-btn.active{color:#a9cde4;background:#15212b}.editor-close{border:1px solid rgba(255,255,255,.13);background:none;color:#dfe7eb;font-size:28px;line-height:1;width:41px;height:41px;cursor:pointer}.editor-tabs{height:54px;display:flex;border-bottom:1px solid rgba(255,255,255,.08);flex:none}.editor-tab{flex:1;border:0;border-right:1px solid rgba(255,255,255,.05);background:#0e151c;color:rgba(231,238,243,.48);font:12px var(--font);letter-spacing:.15em;cursor:pointer;transition:background .25s ease,color .25s ease}.editor-tab.active,.editor-tab:hover{color:#9ec5df;background:#121c24}.editor-pages{position:relative;flex:1;min-height:0;overflow:hidden}.editor-page{display:none;height:100%;padding:20px 22px;overflow-y:auto}.editor-page.active{display:block;animation:pageIn .5s cubic-bezier(.2,.8,.2,1)}.page-heading{height:49px;margin-bottom:11px}.page-heading h2{margin:0;font-size:22px;font-weight:400}.page-heading p{margin:5px 0 0;font-size:12px;color:rgba(231,238,243,.4)}
.content-card,.layout-card,.about-card{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.018);padding:16px;min-height:0}.card-title{font-size:11px;letter-spacing:.16em;color:#709bc0;margin-bottom:11px}.target-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}.target-btn{border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.025);color:rgba(235,241,244,.75);padding:11px;font:12px var(--font);cursor:pointer;text-align:left;transition:border-color .2s ease,background .2s ease}.target-btn.active{border-color:rgba(115,168,212,.42);color:#afd0e3;background:rgba(115,168,212,.06)}.content-editor,.note-editor{width:100%;resize:none;outline:none;border:1px solid rgba(255,255,255,.11);background:#0b1218;color:#edf2f6;padding:12px;font:15px var(--font);line-height:1.45;user-select:text}.editor-tools{display:flex;align-items:center;gap:8px;margin-top:8px}.editor-tools button,.wide-btn,.reset-btn{border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.035);color:#c5d7e0;padding:10px 12px;font:12px var(--font);letter-spacing:.08em;cursor:pointer;transition:background .2s ease,border-color .2s ease,transform .2s ease}.editor-tools button:hover,.wide-btn:hover,.reset-btn:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);transform:translateY(-1px)}.editor-tools span{margin-left:auto;color:rgba(230,237,243,.35);font-size:10px}
.layout-simple{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:calc(100% - 60px)}.layout-card{display:flex;flex-direction:column}.layout-card p{margin:2px 0 12px;color:rgba(231,238,243,.43);font-size:12px;line-height:1.6}.wide-btn{width:100%;margin-top:9px}.wide-btn.primary{color:#b5d6ea;border-color:rgba(115,168,212,.35);background:rgba(115,168,212,.08)}.panel-size-list{display:flex;flex-direction:column;gap:10px}.size-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border:1px solid rgba(255,255,255,.07);padding:10px;background:rgba(255,255,255,.02)}.size-row-name{font-size:11px;letter-spacing:.05em;color:rgba(235,241,244,.72)}.size-controls{display:grid;grid-template-columns:36px 48px 36px;gap:5px}.size-controls button{height:34px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.025);color:#b9d0de;font:14px var(--font);cursor:pointer}.size-value{height:34px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.07);font-size:11px}.size-note{margin-top:auto;padding-top:12px;font-size:11px;line-height:1.5;color:rgba(231,238,243,.32)}
.palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.palette-card{min-height:86px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025);padding:9px;color:rgba(238,243,246,.72);cursor:pointer;text-align:left;transition:transform .2s ease,border-color .2s ease,background .2s ease}.palette-card:hover{transform:translateY(-2px);background:rgba(255,255,255,.04)}.palette-card.selected{border-color:rgba(115,168,212,.55);box-shadow:inset 0 0 0 1px rgba(115,168,212,.12)}.palette-card strong{display:block;font:11px var(--font);letter-spacing:.04em;margin-top:7px}.palette-preview{height:31px;display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:2px}.palette-preview span{display:block;border:1px solid rgba(255,255,255,.09)}
.full-about{height:100%}.full-about h2{font-size:29px;font-weight:400;margin:12px 0}.about-description{font-size:12px;line-height:1.7;color:rgba(231,238,243,.5);max-width:760px}.about-copy{margin-top:25px;font-size:14px;line-height:2;color:#cfdde5}.reset-btn{margin-top:30px;color:#c99784;border-color:rgba(217,144,116,.22)}
.move-bar{position:fixed;left:50%;top:20px;transform:translate(-50%,-30px);opacity:0;visibility:hidden;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s,visibility 0s .5s;z-index:200;display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(9,15,21,.86);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(12px);font-size:10px;letter-spacing:.15em;box-shadow:0 14px 40px rgba(0,0,0,.24)}.move-mode .move-bar{transform:translate(-50%,0);opacity:1;visibility:visible;transition-delay:0s}.mini-btn{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:#c3d5df;padding:8px 11px;font:10px var(--font);cursor:pointer}.mini-btn.primary{color:#b5d6ea;border-color:rgba(115,168,212,.35);background:rgba(115,168,212,.08)}.move-hint{font-size:9px;letter-spacing:.04em;color:rgba(230,237,243,.33);max-width:360px}
@media(max-width:1000px){.hero{gap:5vw}.hero-copy{min-width:42vw}.bottom-grid{gap:8px}.panel{--panel-width:31%!important}.editor-shell{width:95vw;height:90vh}.content-layout,.layout-simple{gap:9px}.palette-grid{grid-template-columns:repeat(4,1fr)}}

/* ===================== YD 2.1 ===================== */
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid rgba(115,168,212,.7);outline-offset:2px}
.content-editor:focus-visible,.note-editor:focus-visible{outline:none}

/* --- hidden elements keep their place, so nothing jumps when something is hidden --- */
.hidden-element{visibility:hidden!important;pointer-events:none}

/* --- move mode --- */
.open-editor{transition:opacity .3s ease,background-color .3s ease}
.move-mode .open-editor{display:none}
.move-mode .moveable{touch-action:none}
.move-mode .editing-target{cursor:grab;outline:1px dashed rgba(115,168,212,.65);outline-offset:8px}
.move-mode .editing-target:active{cursor:grabbing}
.move-mode .editing-target.selected{outline:1px solid var(--warm)}
.move-mode .bottom-grid.editing-target{cursor:default}
/* 3.42: in MOVE mode HIDE really hides the element (no ghost); the chip stays and shows SHOW. The old ghost rule is removed. */
.move-mode .custom-label:empty{min-width:90px;min-height:18px}
.move-mode .custom-label:empty:before{content:"…";opacity:.5}
.move-layer{position:fixed;inset:0;z-index:150;pointer-events:none}
.move-chip{animation:fade .4s ease both;position:fixed;left:0;top:0;display:none;align-items:center;gap:7px;height:26px;padding:0 0 0 8px;background:rgba(9,15,21,.92);border:1px solid rgba(115,168,212,.45);color:#b9d6e6;font-size:10px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;cursor:grab;pointer-events:auto;touch-action:none;will-change:transform;user-select:none}
.move-mode .move-chip{display:flex}
.move-chip:active{cursor:grabbing}
.move-chip.selected{border-color:var(--warm);color:#fff}
.move-chip.is-hidden{opacity:.65;border-style:dashed}
.chip-grip{opacity:.55}
.chip-vis{align-self:stretch;border:0;border-left:1px solid rgba(255,255,255,.12);background:none;color:#b6d1df;padding:0 8px;font:10px var(--font);letter-spacing:.08em;cursor:pointer}
.chip-vis:hover{background:rgba(255,255,255,.09)}
.guide{position:fixed;z-index:140;pointer-events:none;background:var(--warm);opacity:0;transition:opacity .12s ease}
.guide-v{left:50%;top:0;bottom:0;width:1px}
.guide-h{top:50%;left:0;right:0;height:1px}
.grid-overlay{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .25s ease;background-image:linear-gradient(to right,rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.07) 1px,transparent 1px);background-size:var(--cell,40px) var(--cell,40px)}
.move-mode.grid-mode .grid-overlay{opacity:1}
.seg{display:flex}
.seg .mini-btn+.mini-btn{border-left:0}
.mini-btn.active{color:#b5d6ea;background:rgba(115,168,212,.14);border-color:rgba(115,168,212,.4)}
.move-hint{max-width:min(520px,38vw);line-height:1.5;font-size:10px;color:rgba(230,237,243,.55)}

/* --- content tab: one keyboard for the whole tab --- */
.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.keyboard-card{grid-column:1/-1}
.text-card,.note-card{display:flex;flex-direction:column}
.target-grid{grid-template-columns:repeat(4,1fr);margin-bottom:8px}
.target-btn{padding:9px 8px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content-editor,.note-editor{height:78px;transition:border-color .2s ease}
.note-card .note-editor{flex:1;min-height:78px}
.content-editor.is-active,.note-editor.is-active{border-color:rgba(115,168,212,.5)}
.keyboard-head{display:flex;justify-content:space-between;align-items:center}
.keyboard-title{display:flex;align-items:baseline;gap:14px;font-size:11px;letter-spacing:.16em;color:#709bc0}
.typing-into{letter-spacing:.04em;color:rgba(231,238,243,.42)}
.typing-into b{font-weight:400;letter-spacing:.08em;color:#c9dfec}
.key-lang{display:flex}
.small-lang{border:1px solid rgba(255,255,255,.1);background:none;color:rgba(255,255,255,.45);padding:6px 11px;font:11px var(--font);cursor:pointer}
.small-lang+.small-lang{border-left:0}
.small-lang.active{color:#a5c8df;border-color:rgba(115,168,212,.35);background:rgba(115,168,212,.07)}
.virtual-keyboard{margin-top:9px}
.keyboard-row{display:flex;gap:5px;margin-top:5px}
.keyboard-row:nth-child(3){padding:0 2.2%}
.keyboard-row:nth-child(4){padding:0 5%}
.keyboard-row button,.keyboard-bottom button{flex:1;min-width:0;height:36px;padding:0 2px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#d8e2e8;font:13px var(--font);cursor:pointer;transition:background .15s ease,border-color .15s ease}
.keyboard-row button:hover,.keyboard-bottom button:hover{background:rgba(115,168,212,.1);border-color:rgba(115,168,212,.25)}
.keyboard-row button:active,.keyboard-bottom button:active{background:rgba(115,168,212,.22)}
.keyboard-bottom{display:grid;grid-template-columns:1.2fr 1fr 5fr 1.2fr 1.4fr;gap:5px;margin-top:5px}
.keyboard-bottom button{font-size:11px;letter-spacing:.08em}
.keyboard-bottom button.active{color:#b5d6ea;border-color:rgba(115,168,212,.5);background:rgba(115,168,212,.16)}
.typing-tip{margin-top:10px;font-size:11px;line-height:1.5;color:rgba(231,238,243,.34)}

/* --- donate & reset --- */
.donate-box{margin-top:26px;max-width:640px;padding:14px 16px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02)}
.donate-text{margin:0 0 12px;font-size:12px;line-height:1.6;color:rgba(231,238,243,.5)}
.donate-row{display:flex;gap:8px}
.donate-link{flex:1;min-width:0;background:#0b1218;border:1px solid rgba(255,255,255,.11);color:#cfe3ef;padding:10px 12px;font:13px var(--font);user-select:text;text-overflow:ellipsis}
.copy-btn{flex:none;min-width:190px;border:1px solid rgba(115,168,212,.35);background:rgba(115,168,212,.08);color:#b5d6ea;padding:10px 14px;font:12px var(--font);letter-spacing:.08em;cursor:pointer;transition:background .2s ease,color .2s ease,border-color .2s ease}
.copy-btn:hover{background:rgba(115,168,212,.16)}
.copy-btn.done{color:#9fe0b4;border-color:rgba(159,224,180,.45);background:rgba(159,224,180,.08)}
.reset-btn.armed{color:#f0b8a4;border-color:rgba(217,144,116,.6);background:rgba(217,144,116,.12)}
.toast{position:absolute;left:50%;bottom:18px;z-index:5;max-width:80%;padding:10px 16px;transform:translate(-50%,10px);background:#16212b;border:1px solid rgba(115,168,212,.35);color:#cfe3ef;font-size:12px;line-height:1.5;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:1000px){.target-grid{grid-template-columns:1fr 1fr}.copy-btn{min-width:120px}}

/* ===================== YD 2.2 ===================== */
@keyframes rise{from{opacity:0;transform:translateY(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.25}}
.editor-overlay.open .editor-shell{transform:none}
.clock,.date,.code-card,.analog-clock{animation:rise 1s cubic-bezier(.2,.75,.2,1) both}.date{animation-delay:.1s}.code-card{animation-delay:.2s}.analog-clock{animation-delay:.15s}
.panel{animation:fade 1s ease both}.panel:nth-child(2){animation-delay:.12s}.panel:nth-child(3){animation-delay:.24s}
.static-text,.custom-label{animation:fade 1.2s ease both}
.clock,.clock span,.date,.code-card,.static-text,.custom-label,.panel-head,.metric b,.note-display,.track,.artist,.hand,.tick{transition:color .6s ease,text-shadow .6s ease,background-color .6s ease,border-color .6s ease}
.clock{font-variant-numeric:tabular-nums}.clock i{font-style:normal}
.panel>*{zoom:var(--zoom,1)}
.media-body{grid-template-columns:52px minmax(0,1fr)}
.note-display:empty:before{content:"…"}

/* ---- clock templates ---- */
body[data-tpl="1"] .hero-copy,body[data-tpl="3"] .hero-copy,body[data-tpl="6"] .hero-copy{min-width:0;text-align:center}
body[data-tpl="1"] .clock{font:100 min(10vw,16vh) "Segoe UI Light","Segoe UI",sans-serif;--ls:.01em}
body[data-tpl="1"] .date{font-family:"Segoe UI",sans-serif;--ls:.45em}
body[data-tpl="2"] .clock{font:700 clamp(60px,6vw,96px) "Lucida Console",Consolas,monospace;color:var(--accent);text-shadow:0 0 24px rgba(var(--a),.5);--ls:.06em}
body[data-tpl="2"] .clock i{animation:blink 1s steps(2) infinite}
body[data-tpl="3"] .clock{font:200 min(11vw,17vh) "Segoe UI",sans-serif;--ls:.02em}
body[data-tpl="3"] .clock i{opacity:.35}
body[data-tpl="3"] .clock span:last-of-type,body[data-tpl="3"] .clock i:last-of-type{display:none}
body[data-tpl="3"] .date{font-size:13px;--ls:.5em}
body[data-tpl="4"] .clock{font-size:clamp(44px,4.4vw,72px);font-weight:400}
body[data-tpl="4"] .clock:before{content:"$ date  ";color:var(--warm);font-size:.38em;letter-spacing:.08em}
body[data-tpl="4"] .code-card{margin-top:30px;padding:20px 26px;border-left:2px solid var(--accent);background:rgba(var(--p),.3);font-size:clamp(15px,1.2vw,21px)}
body[data-tpl="5"] .hero-copy{order:2;min-width:0}
body[data-tpl="5"] .hero{gap:5vw}
body[data-tpl="5"] .analog-clock{width:min(30vw,40vh);border-width:3px}
body[data-tpl="5"] .clock{font-size:clamp(40px,4vw,66px)}
body[data-tpl="6"] .clock{font:800 min(9vw,14vh) "Segoe UI",sans-serif;color:transparent;-webkit-text-stroke:2px var(--text);--ls:.02em}
body[data-tpl="6"] .clock i{-webkit-text-stroke:2px var(--accent)}
body[data-tpl="7"] .hero-copy{min-width:0}
body[data-tpl="7"] .clock{display:flex;flex-direction:column;font:700 min(8vw,12vh) "Segoe UI",sans-serif;line-height:.9}
body[data-tpl="7"] .clock i{display:none}
body[data-tpl="7"] .clock span:nth-of-type(2){color:var(--accent)}
body[data-tpl="7"] .clock span:nth-of-type(3){font-size:.3em;color:var(--warm);font-weight:300;margin-top:.15em}
body[data-tpl="8"] .hero-copy{padding:26px 40px;border-radius:28px;background:rgba(var(--t),.06);border:1px solid rgba(var(--t),.16);backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,.18)}
body[data-tpl="8"] .clock{font-family:"Segoe UI",sans-serif;font-weight:300}
body[data-tpl="8"] .panel{border-radius:22px;background:rgba(var(--t),.06);backdrop-filter:blur(12px)}
body[data-tpl="8"] .analog-clock{background:rgba(var(--t),.05);backdrop-filter:blur(10px);border-color:rgba(var(--t),.3)}
body[data-tpl="9"] .clock{color:var(--accent);font-weight:400;--ls:.08em;text-shadow:0 0 8px rgba(var(--a),.9),0 0 30px rgba(var(--a),.6),0 0 70px rgba(var(--a),.35)}
body[data-tpl="9"] .date{color:var(--accent)}
body[data-tpl="9"] .analog-clock{border-color:var(--accent);box-shadow:0 0 30px rgba(var(--a),.5),inset 0 0 40px rgba(var(--a),.18)}
body[data-tpl="9"] .hour-hand,body[data-tpl="9"] .minute-hand{background:var(--accent);box-shadow:0 0 10px var(--accent)}
body[data-tpl="9"] .panel{border-color:rgba(var(--a),.4);box-shadow:0 0 22px rgba(var(--a),.14)}

/* ---- editor: style tab ---- */
.card-title.sp{margin-top:22px}
.move-card{max-width:620px}
.tpl-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.tpl-card{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025);padding:10px;color:rgba(238,243,246,.75);cursor:pointer;text-align:left;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,background .25s}
.tpl-card:hover{transform:translateY(-3px);background:rgba(255,255,255,.05)}
.tpl-card.selected{border-color:rgba(115,168,212,.6);background:rgba(115,168,212,.08)}
.tpl-prev{height:44px;display:grid;place-items:center;color:#e7edf2;background:#0b1218;margin-bottom:8px;overflow:hidden}
.tpl-card strong{font:11px var(--font);letter-spacing:.04em}
.pickers{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding-bottom:6px}
.pk{display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);padding:9px 11px;font-size:11px;letter-spacing:.08em;color:rgba(235,241,244,.7)}
.pk input{width:40px;height:30px;border:0;background:none;padding:0;cursor:pointer}
.palette-card{animation:fade .4s ease both}

/* ---- keyboard sheet ---- */
.kb-sheet{position:fixed;left:50%;bottom:76px;z-index:300;width:min(880px,96vw);padding:14px 18px 18px;background:#10171e;border:1px solid rgba(255,255,255,.13);border-radius:20px;box-shadow:0 10px 60px rgba(0,0,0,.55);color:#eaf0f4;transform:translate(-50%,calc(100% + 120px));opacity:0;visibility:hidden;transition:transform .55s cubic-bezier(.2,.85,.2,1),opacity .35s ease,visibility 0s .55s;user-select:none}
.kb-sheet.open{transform:translate(-50%,0);opacity:1;visibility:visible;transition-delay:0s}
.sheet-head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.sheet-head b{font-weight:400;font-size:11px;letter-spacing:.16em;color:#8fb8d6;flex:1}
.sheet-count{font-size:10px;color:rgba(230,237,243,.35)}
.sheet-done{width:38px;height:32px;border:1px solid rgba(115,168,212,.4);background:rgba(115,168,212,.12);color:#b9dcf0;font-size:16px;cursor:pointer;border-radius:8px;transition:background .2s,transform .2s}
.sheet-done:hover{background:rgba(115,168,212,.25);transform:scale(1.06)}
.kb-sheet .note-editor{height:70px;border-radius:10px;border-color:rgba(115,168,212,.45)}
.kb-sheet .editor-tools{margin-top:8px}
.kb-sheet .keyboard-row button,.kb-sheet .keyboard-bottom button,.editor-tools button{border-radius:8px}
.keyboard-row button,.keyboard-bottom button{transition:background .15s,border-color .15s,transform .12s}
.keyboard-row button:active,.keyboard-bottom button:active{transform:scale(.92)}
.small-lang{border-radius:0}

/* ---- move chips: edit / size buttons ---- */
.chip-btn{align-self:stretch;min-width:26px;border:0;border-left:1px solid rgba(255,255,255,.12);background:none;color:#b6d1df;padding:0 7px;font:13px var(--font);cursor:pointer;transition:background .2s,color .2s}
.chip-btn:hover:not(:disabled){background:rgba(255,255,255,.12);color:#fff}
.chip-btn:disabled{opacity:.25;cursor:default}
.chip-edit{color:var(--warm)}
.move-chip{height:28px}

/* ---- scroll buttons (no mouse wheel in Wallpaper Engine) ---- */
.scroll-btns{position:absolute;right:16px;bottom:16px;z-index:6;display:flex;flex-direction:column;gap:8px}
.scroll-btns button{width:46px;height:46px;border:1px solid rgba(115,168,212,.4);background:rgba(16,23,30,.92);color:#b9dcf0;font-size:16px;cursor:pointer;border-radius:12px;transition:background .2s,transform .15s}
.scroll-btns button:hover{background:rgba(115,168,212,.25)}.scroll-btns button:active{transform:scale(.92)}
.editor-page{padding-right:74px}

/* ---- v2.2.1 ---- */
.tpl-grid{margin-top:12px}
.subtabs{display:flex;gap:8px;margin-bottom:14px}
.subtab{flex:1;height:38px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.025);color:rgba(231,238,243,.55);font:11px var(--font);letter-spacing:.14em;cursor:pointer;border-radius:8px;transition:background .25s,color .25s,border-color .25s}
.subtab.active{color:#b5d6ea;border-color:rgba(115,168,212,.45);background:rgba(115,168,212,.1)}
.subpage{display:none}.subpage.active{display:block;animation:pageIn .45s cubic-bezier(.2,.8,.2,1)}
.palette-grid{grid-template-columns:repeat(7,1fr);gap:7px}
.palette-card{min-height:0;padding:6px 6px 5px}.palette-preview{height:20px}.palette-card strong{font-size:10px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title.sp{margin-top:16px}
.pickers{grid-template-columns:repeat(4,1fr)}
body.no-analog:not(.move-mode) .clock-wrap{display:none}
body.no-analog .hero-copy{text-align:center}
body.no-analog .code-card{display:inline-block;text-align:left}
.sheet-done{width:auto;padding:0 16px;font:11px var(--font);letter-spacing:.12em}
.tool-gap{flex:1}
.editor-tools button.mk{min-width:44px;font-size:16px;padding:6px 10px}
.mk-ok{color:#9fe0b4!important;border-color:rgba(159,224,180,.35)!important}.mk-no{color:#f0a493!important;border-color:rgba(240,164,147,.35)!important}
.emoji-box{display:none;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:8px}
.emoji-box button{height:44px;font:22px "Segoe UI Emoji","Apple Color Emoji",sans-serif;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;cursor:pointer;transition:background .15s,transform .12s}
.emoji-box button:hover{background:rgba(115,168,212,.14)}.emoji-box button:active{transform:scale(.88)}
.kb-sheet.emoji-on .emoji-box{display:grid;animation:pageIn .3s ease}
.kb-sheet.emoji-on #virtualKeyboard,.kb-sheet.emoji-on .keyboard-bottom{display:none}

/* ===================== YD 2.3 ===================== */
/* --- on / off switches (stored per template) --- */
body.no-clock #clock,body.no-date #date,body.no-code .code-card{display:none!important}
.move-mode .hero-copy{min-height:60px}

/* --- new templates --- */
body[data-tpl="10"] .hero-copy,body[data-tpl="12"] .hero-copy{min-width:0;text-align:center}
body[data-tpl="10"] .clock{display:inline-block;padding:.16em .4em .12em;font:700 min(6.2vw,10vh) "Lucida Console",Consolas,monospace;--ls:.08em;color:var(--warm);background:rgba(0,0,0,.34);border:1px solid rgba(var(--t),.14);border-radius:10px;box-shadow:inset 0 0 40px rgba(0,0,0,.35),0 0 40px rgba(0,0,0,.18);text-shadow:0 0 8px var(--warm),0 0 34px var(--warm)}
body[data-tpl="10"] .clock i{animation:blink 1s steps(2) infinite}
body[data-tpl="10"] .date{margin-top:18px;--ls:.5em;color:var(--warm)}
body[data-tpl="10"] .code-card{display:inline-block;text-align:left;margin-top:20px;line-height:1.6}
body[data-tpl="11"] .hero-copy{min-width:min(560px,40vw);padding:24px 40px 22px;border-left:3px solid var(--accent);background:rgba(var(--p),.38);box-shadow:0 24px 60px rgba(0,0,0,.16)}
body[data-tpl="11"] .clock{font:300 clamp(54px,5vw,80px) Consolas,monospace;--ls:.03em}
body[data-tpl="11"] .date{margin-top:10px;color:var(--accent)}
body[data-tpl="11"] .code-card{margin-top:16px;padding-top:14px;line-height:1.6;border-top:1px solid rgba(var(--t),.12)}
body[data-tpl="12"] .clock{display:inline-block;padding:.08em .5em .12em;font:600 min(5.8vw,9.5vh) "Segoe UI",sans-serif;--ls:.02em;border-radius:999px;background:var(--accent);color:var(--bg);box-shadow:0 18px 50px rgba(var(--a),.28)}
body[data-tpl="12"] .clock i{opacity:.55}
body[data-tpl="12"] .date{margin-top:18px;--ls:.42em;color:rgba(var(--t),.7)}
body[data-tpl="12"] .code-card{display:inline-block;text-align:left;margin-top:20px;line-height:1.6}

/* --- editor: switches + template previews --- */
.toggle-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggle-grid .wide-btn{margin-top:0}
.wide-btn.tog:not(.primary){color:rgba(197,215,224,.5)}
.tpl-prev span{display:inline-block;line-height:1.25}

/* --- editor menu zoom (A− / A+ in the header) --- */
.ui-scale{display:flex;align-items:center;border:1px solid rgba(255,255,255,.10);overflow:hidden}
.ui-scale button{width:41px;height:33px;border:0;background:#0c141b;color:#a9cde4;font:12px var(--font);cursor:pointer}
.ui-scale button:hover:not(:disabled){background:#15212b}
.ui-scale button:disabled{opacity:.3;cursor:default}
.ui-scale span{min-width:50px;text-align:center;font-size:11px;color:rgba(231,238,243,.6)}
.editor-shell{width:var(--ew,min(1000px,94vw));height:var(--eh,min(720px,92vh));transform:translateY(22px) scale(calc(var(--ui,1) * .97))}
.editor-overlay.open .editor-shell{transform:scale(var(--ui,1))}
.kb-sheet{width:var(--kw,min(880px,96vw));transform-origin:50% 100%;transform:translate(-50%,calc(100% + 120px)) scale(var(--ui,1))}
.kb-sheet.open{transform:translate(-50%,0) scale(var(--ui,1))}
.move-bar{transform-origin:50% 0;transform:translate(-50%,-30px) scale(var(--ui,1))}
.move-mode .move-bar{transform:translate(-50%,0) scale(var(--ui,1))}
.move-chip{transform-origin:0 0}
@media(max-height:800px){
body[data-tpl="10"] .code-card,body[data-tpl="11"] .code-card,body[data-tpl="12"] .code-card{font-size:12px;line-height:1.45;margin-top:10px}
body[data-tpl="11"] .code-card{padding-top:8px}
body[data-tpl="11"] .hero-copy{padding:16px 34px 14px}
}

/* ===================== YD 2.3.1 (standalone host) ===================== */
.host-only{display:none}
body.host .host-only{display:block}
.host-hint{position:absolute;z-index:30;right:2.4%;top:50%;margin-top:-44px;font-size:11px;letter-spacing:.1em;white-space:nowrap;text-align:right;color:rgba(var(--t),.62);pointer-events:none}
body.host.move-mode .host-hint{display:none}
.sys-card{margin-top:12px}

/* ===================== YD 2.4 ===================== */
/* --- exact centring: the whole composition (clock + panels) is one block centred on both axes of the screen.
       The invisible trailing space that letter-spacing adds after the last letter is cancelled, so text is optically centred too. --- */
.clock,.date{letter-spacing:var(--ls);margin-right:calc(var(--ls) * -1)}
body[data-tpl="10"] .clock{margin-right:0;padding-left:calc(.4em + var(--ls))}
body[data-tpl="12"] .clock{margin-right:0;padding-left:calc(.5em + var(--ls))}
.code-card{text-align:left}
.hero-copy>*{max-width:100%}

/* --- right-edge cluster: hint, EDIT, EXIT --- */
.edge-ui{position:absolute;z-index:30;right:2.4%;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.edge-ui .open-editor{position:static;transform:none}
.move-mode .edge-ui{display:none}
.host-hint{position:static;margin:0 0 4px;font-size:12px;line-height:1.55;letter-spacing:.08em;white-space:pre-line;text-align:right;color:rgba(var(--t),.74);pointer-events:none}
body.host.move-mode .host-hint{display:none}
.quit-btn{color:var(--warm);border-color:rgba(217,144,116,.32)}
.quit-btn.armed,.quit-sys.armed{opacity:1;color:#f0b8a4;border-color:rgba(217,144,116,.7);background:rgba(217,144,116,.16)}

/* --- player is Wallpaper Engine only: not shown in the standalone version --- */
body.host #mediaPanel{display:none}

/* --- SYSTEM card: start-with-Windows switch --- */
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.025)}
.switch-text{display:flex;flex-direction:column;gap:4px;min-width:0}
.switch-text b{font-weight:400;font-size:13px;letter-spacing:.06em;color:#d7e6ee}
.switch-text small{font-size:11px;line-height:1.45;color:rgba(231,238,243,.42)}
.switch{flex:none;position:relative;width:60px;height:32px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);cursor:pointer;padding:0;transition:background .25s ease,border-color .25s ease}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#8fa3b0;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s ease}
.switch.on{background:rgba(115,168,212,.32);border-color:rgba(115,168,212,.7)}
.switch.on i{transform:translateX(28px);background:#bfe0f3}
.sys-card .wide-btn{margin-top:10px}
.sys-card .switch-row+.wide-btn{margin-top:14px}
.quit-sys{color:#e0a28d;border-color:rgba(217,144,116,.28)}

/* 2.5: extra monitors show only the wallpaper - no edit/exit buttons, hints or editor */
body.secondary #hostHint, body.secondary #openEditor, body.secondary #quitBtn, body.secondary #editorOverlay{display:none!important}
body.secondary, body.secondary *{cursor:none}

/* ===================== YD 2.7: AI helper ===================== */
/* Wallpaper Engine / Lively have no local bridge: no AI panel and no AI tab there (the player stays) */
body:not(.host) #aiPanel, body:not(.host) .host-tab{display:none}
#aiPanel{display:flex;flex-direction:column}
.ai-greeting{margin-top:15px;font-size:15px;line-height:1.55;color:rgba(var(--t),.92);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;word-break:break-word}
.ai-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:26px}
.ai-sub{font-size:11px;letter-spacing:.1em;color:rgba(var(--t),.42);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-btns{display:flex;gap:6px;margin-left:auto}
.ai-mini{width:30px;height:26px;border:1px solid rgba(var(--a),.24);background:rgba(var(--p),.38);color:var(--accent);font:13px var(--font);border-radius:4px;cursor:pointer;opacity:.55;padding:0}
.ai-mini:hover{opacity:1}.ai-mini.live{opacity:1;color:var(--warm);border-color:var(--warm)}
body.secondary .ai-btns{display:none}
body.move-mode .ai-btns{display:none}

/* editor tab */
.ai-status-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.ai-state{font-size:13px;color:#cfe3ef;letter-spacing:.05em}
.wide-btn.ai-inline{width:auto;margin-top:0;padding-left:16px;padding-right:16px}
.ai-field{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:11px;letter-spacing:.14em;color:#709bc0}
.ai-field select{width:100%;padding:10px 12px;background:#101a23;color:#d7e6ee;border:1px solid rgba(255,255,255,.14);font:13px var(--font);letter-spacing:.04em;border-radius:3px}
.ai-help{margin:14px 0 0!important;font-size:12px;line-height:1.6}
.ai-row2{margin-top:10px}
.wide-btn:disabled{opacity:.35;cursor:not-allowed}

/* chat window */
.ai-chat{position:fixed;inset:0;z-index:140;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5vh;background:rgba(0,0,0,.26);backdrop-filter:blur(1.5px);visibility:hidden;opacity:0;transition:opacity .25s ease,visibility 0s .25s}
.ai-chat.open{visibility:visible;opacity:1;transition:opacity .25s ease}
.ai-shell{zoom:var(--ui,1);width:min(780px,calc(94vw / var(--ui,1)));height:min(620px,calc(84vh / var(--ui,1)));display:flex;flex-direction:column;background:#101a23;border:1px solid rgba(115,168,212,.32);box-shadow:0 30px 90px rgba(0,0,0,.55);border-radius:6px;overflow:hidden;color:#d7e6ee;font-family:var(--font)}
.ai-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08);flex:none}
.ai-title{display:flex;align-items:baseline;gap:12px;min-width:0}.ai-title b{font-weight:400;font-size:12px;letter-spacing:.2em;color:#73a8d4}
.ai-modeltag{font-size:11px;color:rgba(231,238,243,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-head-btns{display:flex;gap:8px;flex:none}
.ai-hbtn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#b5d6ea;font:11px var(--font);letter-spacing:.1em;padding:8px 11px;border-radius:3px;cursor:pointer}
.ai-hbtn:hover:not(:disabled){background:rgba(115,168,212,.16)}.ai-hbtn:disabled{opacity:.35;cursor:not-allowed}
.ai-x{font-size:18px;line-height:1;padding:5px 12px}
.ai-log{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;user-select:text}
.ai-msg{max-width:86%;padding:10px 13px;border-radius:6px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.ai-msg.user{align-self:flex-end;background:rgba(115,168,212,.22);border:1px solid rgba(115,168,212,.4)}
.ai-msg.bot{align-self:flex-start;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)}
.ai-msg.err{border-color:rgba(217,144,116,.5);color:#f0b8a4}
.ai-chip{margin-top:7px;font-size:12px;letter-spacing:.03em;padding:5px 8px;border-radius:3px;background:rgba(0,0,0,.25)}
.ai-chip.ok{color:#9fd6b4}.ai-chip.bad{color:#f0b8a4}
.ai-line{flex:none;min-height:20px;padding:0 16px 6px;font-size:12px;letter-spacing:.06em;color:rgba(231,238,243,.5)}
.ai-chat.busy .ai-line{color:#73a8d4}
.ai-inrow{flex:none;display:flex;gap:8px;padding:0 14px 14px}
.ai-input{flex:1;min-width:0;padding:12px 14px;background:#0b141c;color:#e7edf2;border:1px solid rgba(255,255,255,.16);border-radius:4px;font:15px var(--font);outline:none;user-select:text}
.ai-input:focus{border-color:#73a8d4}
.ai-micbtn,.ai-send{border:1px solid rgba(115,168,212,.4);background:rgba(115,168,212,.14);color:#cfe3ef;font:13px var(--font);letter-spacing:.1em;border-radius:4px;cursor:pointer}
.ai-micbtn{width:50px;font-size:18px}.ai-send{padding:0 18px}
.ai-micbtn.live{background:rgba(217,144,116,.28);border-color:#d99074;color:#fff;animation:aipulse 1.1s ease-in-out infinite}
@keyframes aipulse{0%,100%{box-shadow:0 0 0 0 rgba(217,144,116,.5)}50%{box-shadow:0 0 0 8px rgba(217,144,116,0)}}
.ai-micbtn:disabled,.ai-send:disabled{opacity:.4;cursor:not-allowed}


/* ===================== YD 2.8 ===================== */
body.secondary #restartBtn{display:none!important}
/* microphone icon (SVG instead of the emoji) */
.mic-ico{display:block;margin:auto;width:1.15em;height:1.15em}
.ai-mini .mic-ico{width:15px;height:15px}
.ai-micbtn .mic-ico{width:22px;height:22px}
.live .mic-ico rect{fill:currentColor}
/* last exchange on the desktop panel */
.ai-q{margin-top:12px;font-size:12px;letter-spacing:.04em;color:rgba(var(--t),.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-q + .ai-greeting{margin-top:6px;-webkit-line-clamp:3}
/* chat inside the editor menu (CHAT tab) */
.chat-page{overflow:hidden}
.ai-dock{height:100%}
.ai-shell.embedded{zoom:1;width:100%;height:100%;box-shadow:none;border-radius:4px}
/* chat on the desktop: no dimming, themed with the current palette, the wallpaper stays visible around it */
.ai-chat{background:transparent;backdrop-filter:none;padding-bottom:4vh}
.ai-chat .ai-shell:not(.embedded){width:min(880px,calc(94vw / var(--ui,1)));height:min(560px,calc(72vh / var(--ui,1)));background:rgba(var(--p),.82);backdrop-filter:blur(14px);border:1px solid rgba(var(--a),.36);box-shadow:0 18px 60px rgba(0,0,0,.45);color:var(--text)}
.ai-chat .ai-shell:not(.embedded) .ai-head{border-bottom-color:rgba(var(--t),.1)}
.ai-chat .ai-shell:not(.embedded) .ai-title b{color:var(--accent)}
.ai-chat .ai-shell:not(.embedded) .ai-modeltag,.ai-chat .ai-shell:not(.embedded) .ai-line{color:rgba(var(--t),.5)}
.ai-chat .ai-shell:not(.embedded) .ai-hbtn{border-color:rgba(var(--t),.18);background:rgba(var(--t),.05);color:var(--text)}
.ai-chat .ai-shell:not(.embedded) .ai-msg.user{background:rgba(var(--a),.22);border-color:rgba(var(--a),.45)}
.ai-chat .ai-shell:not(.embedded) .ai-msg.bot{background:rgba(var(--t),.06);border-color:rgba(var(--t),.12)}
.ai-chat .ai-shell:not(.embedded) .ai-input{background:rgba(var(--p),.7);color:var(--text);border-color:rgba(var(--t),.22)}
.ai-chat .ai-shell:not(.embedded) .ai-input:focus{border-color:var(--accent)}
.ai-chat .ai-shell:not(.embedded) .ai-micbtn,.ai-chat .ai-shell:not(.embedded) .ai-send{border-color:rgba(var(--a),.5);background:rgba(var(--a),.16);color:var(--text)}

/* ===================== YD 2.9: presets, auto theme, system panel ===================== */
body:not(.host) #sysPanel{display:none}
.sys-metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-top:14px}
.sys-net{margin-top:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-row{display:flex;gap:10px;align-items:flex-end}
.ex-input,.ex-field select{padding:10px 12px;background:#101a23;color:#d7e6ee;border:1px solid rgba(255,255,255,.14);font:13px var(--font);letter-spacing:.04em;border-radius:3px;min-width:0;outline:none}
.ex-input{flex:1;width:100%}.ex-input:focus,.ex-field select:focus{border-color:#73a8d4}
.ex-input:disabled{opacity:.5}
.ex-field{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:11px;letter-spacing:.14em;color:#709bc0;flex:1;min-width:0}
.ex-field.half{flex:1}.ex-field select{width:100%}
.wide-btn.ex-inline{width:auto;margin-top:0;padding-left:18px;padding-right:18px;flex:none;white-space:nowrap}
.ex-hint{margin:8px 0 0!important;font-size:11px!important;line-height:1.5!important}
.ex-status{margin:12px 0 4px;font-size:12px;line-height:1.55;color:#9ec5df;letter-spacing:.04em;min-height:18px}
.preset-list{display:flex;flex-direction:column;gap:8px}
.preset-empty{font-size:12px;color:rgba(231,238,243,.42);line-height:1.6}
.preset-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.025)}
.preset-sw{display:flex;flex:none;border:1px solid rgba(255,255,255,.14);border-radius:3px;overflow:hidden}.preset-sw span{width:16px;height:30px;display:block}
.preset-row .ex-input{padding:7px 9px}
.preset-meta{flex:none;font-size:10px;letter-spacing:.08em;color:rgba(231,238,243,.4);white-space:nowrap}
.mini-act{flex:none;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#b5d6ea;font:11px var(--font);letter-spacing:.1em;padding:9px 12px;border-radius:3px;cursor:pointer;white-space:nowrap}
.mini-act:hover{background:rgba(115,168,212,.16)}
.mini-act.armed{color:#f0b8a4;border-color:rgba(217,144,116,.7);background:rgba(217,144,116,.16)}
.slot-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.slot-row{display:grid;grid-template-columns:96px 104px 1fr;gap:10px;align-items:center}
.slot-row b{font-weight:400;font-size:12px;letter-spacing:.14em;color:#d7e6ee}
.slot-row select{width:100%;padding:10px 12px;background:#101a23;color:#d7e6ee;border:1px solid rgba(255,255,255,.14);font:13px var(--font);border-radius:3px;min-width:0}
.slot-row .ex-input{padding:9px 8px}
.sun-box{display:none;margin-top:6px}.sun-box.on{display:block}
#autoSkip.armed{color:#f0b8a4;border-color:rgba(217,144,116,.7);background:rgba(217,144,116,.16)}
.layout-card .switch-row+.ex-field{margin-top:14px}
.ai-savebtn{margin-top:8px;border:1px solid rgba(var(--a),.4);background:rgba(var(--a),.12);color:inherit;font:12px var(--font);letter-spacing:.06em;padding:7px 11px;border-radius:3px;cursor:pointer}
.ai-savebtn:disabled{opacity:.45;cursor:default}
.layout-card>.ex-field{flex:none}.ex-row .ex-field{margin-top:0}
.ex-row{align-items:flex-end}

/* ===================== YD 3.0: timer widget ===================== */
.timer-widget{position:absolute;z-index:6;right:4.2%;top:5.5%;width:clamp(230px,17vw,340px);padding:15px 18px 14px;border:1px solid rgba(var(--t),.10);background:rgba(var(--p),.22);box-shadow:inset 0 0 40px rgba(var(--t),.012),0 14px 36px rgba(0,0,0,.08);animation:fade 1s ease both;transition:background-color .48s ease,border-color .4s ease,box-shadow .4s ease,opacity .35s ease}
body[data-tpl="8"] .timer-widget{border-radius:22px;background:rgba(var(--t),.06);backdrop-filter:blur(12px)}
body[data-tpl="9"] .timer-widget{border-color:rgba(var(--a),.4);box-shadow:0 0 22px rgba(var(--a),.14)}
.tw-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.19em;color:var(--accent);padding-bottom:10px;border-bottom:1px solid rgba(var(--t),.07);transition:color .6s ease}
.tw-time{margin-top:14px;font-size:clamp(34px,3.1vw,58px);line-height:1;letter-spacing:.04em;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;transition:color .4s ease}
.tw-bar{margin-top:13px}
.timer-widget.is-run .tw-bar i{background:var(--accent)}
.timer-widget.is-pause .tw-time{opacity:.6}
.timer-widget.is-done .tw-time,.timer-widget.is-done .tw-head{color:var(--warm)}
.timer-widget.is-done .tw-bar i{background:var(--warm)}
.timer-widget.ring{animation:twRing 1s ease-in-out infinite;border-color:rgba(var(--a),.7)}
@keyframes twRing{0%,100%{box-shadow:0 0 0 0 rgba(var(--a),.0),0 14px 36px rgba(0,0,0,.08)}50%{box-shadow:0 0 28px 4px rgba(var(--a),.45),0 14px 36px rgba(0,0,0,.08)}}
.tw-ctl{margin-top:12px;display:flex;flex-direction:column;gap:6px;opacity:0;pointer-events:none;transition:opacity .25s ease}
.timer-widget:hover .tw-ctl,body:has(#aiChat.open) .tw-ctl{opacity:1;pointer-events:auto}
body:has(#aiChat.open) .timer-widget{z-index:150}
.tw-row{display:flex;gap:6px}
.tw-btn{flex:1;min-width:0;padding:7px 4px;border:1px solid rgba(var(--t),.16);background:rgba(var(--t),.04);color:var(--text);font:12px var(--font);letter-spacing:.06em;cursor:pointer;border-radius:3px}
.tw-btn:hover{background:rgba(var(--a),.2);border-color:rgba(var(--a),.5)}
.tw-btn.tw-main{background:rgba(var(--a),.22);border-color:rgba(var(--a),.55)}
.tw-btn.on{background:rgba(var(--a),.28);border-color:rgba(var(--a),.7)}
.move-mode .timer-widget button{pointer-events:none}
.move-mode .timer-widget .tw-ctl{opacity:0}
body.secondary .tw-ctl{display:none}
.tw-editbox{display:none;margin-top:6px}.tw-editbox.on{display:block}
.tw-editbox .ex-row{margin-top:2px}
.tw-sound-row{margin-top:12px}
.widgets-card .ex-status{margin-bottom:0}

/* ===== YD 3.1: timer size + settings, component names in the system panel ===== */
.timer-widget{width:calc(clamp(230px,17vw,340px)*var(--tws,1));padding:calc(15px*var(--tws,1)) calc(18px*var(--tws,1)) calc(14px*var(--tws,1))}
.tw-head{font-size:calc(12px*var(--tws,1));padding-bottom:calc(10px*var(--tws,1))}
.tw-head .panel-code{font-size:calc(10px*var(--tws,1))}
.tw-time{margin-top:calc(14px*var(--tws,1));font-size:calc(clamp(34px,3.1vw,58px)*var(--tws,1))}
.tw-bar{margin-top:calc(13px*var(--tws,1));height:calc(3px*var(--tws,1))}
.tw-ctl{margin-top:calc(12px*var(--tws,1));gap:calc(6px*var(--tws,1))}
.tw-row{gap:calc(6px*var(--tws,1))}
.tw-btn{font-size:calc(12px*var(--tws,1));padding:calc(7px*var(--tws,1)) 4px}
.tw-look-title{margin-top:18px}
.tw-size-row{margin-top:8px}
.tw-seg{display:flex}.tw-seg .mini-btn{flex:1;padding:10px 6px;letter-spacing:.08em}
.tw-range{width:100%;accent-color:#73a8d4;margin:4px 0 0}
.tw-editbox .ex-field{margin-top:14px}
.tw-editbox .switch-row.tw-sound-row{margin-top:8px}
.sys-metrics .metric>div:first-child{align-items:baseline}
.sys-metrics .metric>div:first-child>span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sys-metrics .metric>div:first-child>b{flex:none}
.sys-metrics .hw-name{letter-spacing:.04em}

/* ===== YD 3.1: AI power button ===== */
.pw:not(.on){opacity:.5}
.pw.on{color:var(--accent);border-color:rgba(var(--a),.6);background:rgba(var(--a),.18)}
.ai-onrow{margin-bottom:12px}

/* ===== YD 3.0: updates from GitHub ===== */
.upd-card .wide-btn{margin-top:10px}
.upd-card .upd-actions .wide-btn{margin-top:0}
.upd-ver{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.12em;color:rgba(231,238,243,.5)}
.upd-ver b{font-weight:400;font-size:15px;letter-spacing:.08em;color:#d7e6ee}
.upd-badge{display:none;margin-left:auto;padding:3px 9px;border:1px solid rgba(var(--a),.55);background:rgba(var(--a),.16);color:var(--accent);font-size:10px;letter-spacing:.14em}
.upd-badge.on{display:inline-block}
.upd-notes{display:none;margin:8px 0 2px;padding:9px 11px;max-height:130px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:11px;line-height:1.5;color:rgba(231,238,243,.55);border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.02)}
.upd-notes.on{display:block}
.upd-bar{display:none;height:3px;margin-top:10px;background:rgba(255,255,255,.08)}
.upd-bar.on{display:block}
.upd-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.upd-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.upd-actions .wide-btn{white-space:normal;line-height:1.35}
.upd-actions .wide-btn.armed{color:#ffd9c9;border-color:rgba(217,144,116,.6);background:rgba(217,144,116,.12)}
.upd-auto{margin-top:14px}
.ex-status.err{color:#e8a58f}

/* ===================== YD 3.01: three more clock styles (14 Gradient, 15 Flip, 16 Frame) ===================== */
body[data-tpl="13"] .clock{font:700 clamp(60px,6.4vw,104px) "Segoe UI",sans-serif;--ls:.02em;background:linear-gradient(100deg,var(--accent),var(--warm));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
body[data-tpl="13"] .clock i{opacity:.65}
body[data-tpl="13"] .date{--ls:.4em;color:var(--warm)}
body[data-tpl="14"] .clock{display:flex;align-items:center;gap:.1em;font:600 clamp(46px,5vw,84px) "Segoe UI",sans-serif;--ls:0em;line-height:1}
body[data-tpl="14"] .clock span{position:relative;display:inline-block;min-width:1.3em;text-align:center;padding:.14em .08em .12em;background:rgba(var(--p),.62);border:1px solid rgba(var(--t),.14);border-radius:.16em;box-shadow:0 .2em .6em rgba(0,0,0,.22)}
body[data-tpl="14"] .clock span:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.32)}
body[data-tpl="14"] .clock i{font-size:.6em;opacity:.55}
body[data-tpl="14"] .date{margin-top:20px;--ls:.4em}
body[data-tpl="15"] .clock{display:inline-block;padding:.22em .5em .18em;font:200 clamp(44px,4.6vw,76px) Consolas,monospace;--ls:.22em;border-top:1px solid var(--accent);border-bottom:1px solid var(--accent)}
body[data-tpl="15"] .clock i{color:var(--accent)}
body[data-tpl="15"] .date{margin-top:16px;--ls:.5em;color:var(--accent)}
body[data-tpl="15"] .code-card{margin-top:22px}
body[data-tpl="15"] .clock{margin-right:0;padding-left:calc(.5em + var(--ls))}
body[data-tpl="14"] .clock{margin-right:0}
@media(max-height:800px){
body[data-tpl="13"] .code-card,body[data-tpl="14"] .code-card,body[data-tpl="15"] .code-card{font-size:12px;line-height:1.45;margin-top:10px}
}

/* ===== YD 3.02: pencil on the Notes panel + daily tasks widget ===== */
.panel-head-r{display:flex;align-items:center;gap:10px}
.note-edit-btn{width:30px;height:24px;display:grid;place-items:center;padding:0;border:1px solid rgba(var(--a),.24);background:rgba(var(--p),.38);color:var(--accent);border-radius:4px;cursor:pointer;opacity:.55;transition:opacity .2s ease,background-color .2s ease}
.note-edit-btn svg{width:14px;height:14px}
.note-edit-btn:hover,body:has(#aiChat.open) .note-edit-btn{opacity:1}
.note-edit-btn:hover{background:rgba(var(--a),.2)}
body.secondary .note-edit-btn,body.move-mode .note-edit-btn{display:none}

.daily-widget{position:absolute;z-index:6;left:4.2%;top:13%;width:calc(clamp(230px,17vw,340px)*var(--dws,1));padding:calc(15px*var(--dws,1)) calc(18px*var(--dws,1)) calc(14px*var(--dws,1));border:1px solid rgba(var(--t),.10);background:rgba(var(--p),.22);box-shadow:inset 0 0 40px rgba(var(--t),.012),0 14px 36px rgba(0,0,0,.08);animation:fade 1s ease both;transition:background-color .48s ease,border-color .4s ease,box-shadow .4s ease,opacity .35s ease}
body[data-tpl="8"] .daily-widget{border-radius:22px;background:rgba(var(--t),.06);backdrop-filter:blur(12px)}
body[data-tpl="9"] .daily-widget{border-color:rgba(var(--a),.4);box-shadow:0 0 22px rgba(var(--a),.14)}
body:has(#aiChat.open) .daily-widget{z-index:150}
.dw-head{display:flex;justify-content:space-between;align-items:center;font-size:calc(12px*var(--dws,1));letter-spacing:.19em;color:var(--accent);padding-bottom:calc(10px*var(--dws,1));border-bottom:1px solid rgba(var(--t),.07);transition:color .6s ease}
.dw-head .panel-code{font-size:calc(10px*var(--dws,1))}
.daily-widget.all-done .dw-head .panel-code{color:var(--accent)}
.dw-list{margin-top:calc(12px*var(--dws,1));display:flex;flex-direction:column;gap:calc(8px*var(--dws,1))}
.dw-row{display:flex;align-items:center;gap:calc(11px*var(--dws,1));min-width:0;cursor:pointer;user-select:none}
.dw-mark{flex:none;width:calc(24px*var(--dws,1));height:calc(24px*var(--dws,1));display:grid;place-items:center;padding:0;border:1px solid currentColor;border-radius:4px;background:transparent;color:var(--warm);cursor:pointer;transition:color .25s ease,background-color .25s ease}
.dw-mark svg{width:62%;height:62%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dw-row:hover .dw-mark{background:rgba(var(--t),.07)}
.dw-row.is-done .dw-mark{color:var(--accent);background:rgba(var(--a),.18)}
.dw-name{flex:1;min-width:0;font-size:calc(15px*var(--dws,1));line-height:1.3;color:var(--text);word-break:break-word;transition:opacity .25s ease}
.dw-row.is-done .dw-name{opacity:.5;text-decoration:line-through;text-decoration-thickness:1px}
.dw-empty{font-size:calc(13px*var(--dws,1));line-height:1.55;color:rgba(var(--t),.45)}
.dw-bar{margin-top:calc(13px*var(--dws,1));height:calc(3px*var(--dws,1))}
.daily-widget.all-done .dw-bar i{background:var(--accent)}
.dw-foot{margin-top:calc(10px*var(--dws,1));font-size:calc(10px*var(--dws,1));letter-spacing:.12em;color:rgba(var(--t),.34)}
.move-mode .daily-widget .dw-mark{pointer-events:none}
.move-mode .daily-widget .dw-row{cursor:inherit}
body.secondary .dw-row,body.secondary .dw-mark{pointer-events:none;cursor:default}

/* settings card */
.dy-editbox{display:none;margin-top:6px}.dy-editbox.on{display:block}
.dy-tasks-title{margin-top:14px}
.dy-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dy-empty{font-size:12px;color:rgba(231,238,243,.42);line-height:1.6}
.dy-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.025)}
.dy-row .ex-input{padding:7px 9px}
.dy-mark{flex:none;width:34px;height:34px;display:grid;place-items:center;padding:0;border:1px solid rgba(217,144,116,.6);border-radius:4px;background:transparent;color:#d99074;cursor:pointer}
.dy-mark svg{width:60%;height:60%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.dy-del{flex:none;width:34px;height:34px;padding:0;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:#c3d5df;font:16px var(--font);cursor:pointer;border-radius:4px}
.dy-del:hover{border-color:rgba(217,144,116,.6);color:#e8a58f}

.dy-size-row{margin-top:14px}
.dy-bar-row{margin-top:12px}

/* ===== YD 3.3: spinner widget (5 types, upgrades) (click the centre: it spins faster and faster) ===== */
.spinner-widget{position:absolute;z-index:6;right:4.2%;top:27%;width:calc(clamp(210px,15vw,300px)*var(--sps,1));padding:calc(15px*var(--sps,1)) calc(18px*var(--sps,1)) calc(14px*var(--sps,1));border:1px solid rgba(var(--t),.10);background:rgba(var(--p),.22);box-shadow:inset 0 0 40px rgba(var(--t),.012),0 14px 36px rgba(0,0,0,.08);animation:fade 1s ease both;transition:background-color .48s ease,border-color .4s ease,box-shadow .4s ease,opacity .35s ease;--g:0}
body[data-tpl="8"] .spinner-widget{border-radius:22px;background:rgba(var(--t),.06);backdrop-filter:blur(12px)}
body[data-tpl="9"] .spinner-widget{border-color:rgba(var(--a),.4);box-shadow:0 0 22px rgba(var(--a),.14)}
body:has(#aiChat.open) .spinner-widget{z-index:150}
.spinner-widget.fast{border-color:rgba(var(--a),.55);box-shadow:inset 0 0 40px rgba(var(--t),.012),0 0 calc(30px*var(--g)) rgba(var(--a),calc(.55*var(--g))),0 14px 36px rgba(0,0,0,.08)}
.sp-head{display:flex;justify-content:space-between;align-items:center;font-size:calc(12px*var(--sps,1));letter-spacing:.19em;color:var(--accent);padding-bottom:calc(10px*var(--sps,1));border-bottom:1px solid rgba(var(--t),.07)}
.sp-head .panel-code{font-size:calc(10px*var(--sps,1));min-width:7ch;text-align:right;font-variant-numeric:tabular-nums}
.sp-stage{position:relative;width:100%;aspect-ratio:1/1;margin-top:calc(8px*var(--sps,1));user-select:none;-webkit-user-select:none}
.sp-ring{position:absolute;inset:3%;border-radius:50%;border:1px solid rgba(var(--t),.09);box-shadow:0 0 calc(24px*var(--g)) rgba(var(--a),calc(.35*var(--g))) inset}
.sp-rod{position:absolute;inset:0;will-change:transform;pointer-events:none}
.sp-arm{position:absolute;left:50%;top:50%;width:43%;height:calc(var(--th,11)*1%);margin-top:calc(var(--th,11)*-.5%);transform-origin:0 50%;border-radius:999px;background:linear-gradient(90deg,var(--accent),rgba(var(--a),.55));box-shadow:0 0 calc(18px*var(--g)) rgba(var(--a),calc(.8*var(--g)))}
.sp-arm i{position:absolute;top:50%;right:-9%;width:40%;aspect-ratio:1/1;transform:translateY(-50%);border-radius:50%;border:2px solid var(--warm);background:rgba(var(--p),.9)}
.sp-trail{opacity:0}
.sp-trail .sp-arm{background:var(--accent);box-shadow:none}
.sp-trail .sp-arm i{display:none}
.sp-hub{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1/1;transform:translate(-50%,-50%);padding:0;border-radius:50%;border:2px solid var(--accent);background:rgba(var(--p),.92);color:var(--accent);cursor:pointer;display:grid;place-items:center;touch-action:manipulation;transition:transform .12s ease,box-shadow .2s ease,background-color .2s ease;box-shadow:0 0 calc(10px + 22px*var(--g)) rgba(var(--a),calc(.25 + .6*var(--g)))}
.sp-hub span{width:34%;aspect-ratio:1/1;border-radius:50%;background:var(--accent);opacity:.9}
.sp-hub:hover{background:rgba(var(--a),.22)}
.sp-hub.kick,.sp-hub:active{transform:translate(-50%,-50%) scale(.9)}
.sp-meter{margin-top:calc(10px*var(--sps,1));height:calc(3px*var(--sps,1))}
.sp-meter i{transition:none}
.spinner-widget.fast .sp-meter i{background:var(--warm)}
.sp-foot{display:flex;flex-direction:column;align-items:center;text-align:center;gap:calc(4px*var(--sps,1));margin-top:calc(9px*var(--sps,1));font-size:calc(10px*var(--sps,1));letter-spacing:.12em;color:rgba(var(--t),.38);white-space:nowrap}
.sp-tip{overflow:hidden;text-overflow:ellipsis}
.move-mode .spinner-widget .sp-hub{pointer-events:none}
body.secondary .sp-hub{pointer-events:none;cursor:default}
.sp-editbox{display:none;margin-top:6px}.sp-editbox.on{display:block}
.sp-size-row{margin-top:14px}
/* 3.3 hotkey settings */
.hk-block{margin-top:14px}.hk-row{margin-top:8px}
.hk-key{flex:none;min-width:136px;border:1px solid rgba(115,168,212,.35);background:rgba(115,168,212,.08);color:#b5d6ea;padding:9px 12px;font:12px var(--font);letter-spacing:.06em;text-align:center;cursor:pointer}
.hk-key:hover{background:rgba(115,168,212,.16)}
.hk-key.capturing{border-color:#d99074;color:#f0c5b4;background:rgba(217,144,116,.12);animation:hkPulse 1s ease-in-out infinite}
.hk-key.bad{border-color:rgba(232,160,138,.6);color:#e8a08a;text-decoration:line-through}
.ex-status.bad{color:#e8a08a}
@keyframes hkPulse{50%{opacity:.55}}

/* ===== YD 3.3: spinner types and upgrades ===== */
.sp-sub{margin:16px 0 8px;font-size:11px;letter-spacing:.16em;color:rgba(231,238,243,.5)}
.sp-types{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sp-type{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 6px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.025);color:rgba(231,238,243,.6);cursor:pointer;font:inherit;font-size:11px;letter-spacing:.08em}
.sp-type svg{width:38px;height:38px}
.sp-type:hover{background:rgba(255,255,255,.06)}
.sp-type.on{border-color:rgba(115,168,212,.6);background:rgba(115,168,212,.12);color:#cfe6f5}
.sp-up{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;margin-bottom:8px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.025)}
.sp-up-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.sp-up-info b{font-size:12px;letter-spacing:.08em;font-weight:600}
.sp-up-info small{font-size:11px;line-height:1.45;color:rgba(231,238,243,.48)}
.sp-up .wide-btn{margin-top:0;min-width:120px}
.sp-foot #spCoins{color:var(--warm)}

/* ===== YD 3.31: spinner upgrades and settings live in a popup on the widget (gear button), not in Edit ===== */
.sp-head-r{display:flex;align-items:center;gap:calc(8px*var(--sps,1))}
.sp-popup{position:fixed;z-index:170;display:none;left:0;top:0;width:380px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow-y:auto;padding:14px 16px 16px;border:1px solid rgba(var(--a),.4);background:rgba(var(--p),.94);backdrop-filter:blur(14px);box-shadow:0 18px 60px rgba(0,0,0,.5);color:var(--text);font-family:var(--font);scrollbar-width:thin}
.sp-popup.open{display:block;animation:fade .18s ease both}
body.secondary .sp-popup,.move-mode .sp-popup{display:none!important}
.sp-pop-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.19em;color:var(--accent);padding-bottom:10px;border-bottom:1px solid rgba(var(--t),.1)}
.sp-pop-x{width:28px;height:28px;padding:0;border:1px solid rgba(var(--t),.18);background:rgba(var(--t),.05);color:var(--text);font:18px/1 var(--font);cursor:pointer}
.sp-pop-x:hover{background:rgba(var(--a),.22)}
.sp-pop-status{margin:10px 0 0;font-size:12px;line-height:1.55;letter-spacing:.04em;color:var(--accent)}
.sp-popup .sp-sub{margin:14px 0 8px;color:rgba(var(--t),.55)}
.sp-popup .sp-up,.sp-popup .size-row{border-color:rgba(var(--t),.12);background:rgba(var(--t),.04)}
.sp-popup .sp-up-info small{color:rgba(var(--t),.55)}
.sp-popup .wide-btn,.sp-popup .size-controls button,.sp-popup .size-value{border-color:rgba(var(--t),.18);background:rgba(var(--t),.05);color:var(--text)}
.sp-popup .wide-btn:hover:not(:disabled),.sp-popup .size-controls button:hover:not(:disabled){background:rgba(var(--a),.2);border-color:rgba(var(--a),.5)}
.sp-popup .size-row-name{color:rgba(var(--t),.75)}
.sp-popup .sp-type{border-color:rgba(var(--t),.14);background:rgba(var(--t),.04);color:rgba(var(--t),.7)}
.sp-popup .sp-type:hover{background:rgba(var(--t),.09)}
.sp-popup .sp-type.on{border-color:rgba(var(--a),.7);background:rgba(var(--a),.18);color:var(--accent)}
.sp-popup .sp-up .wide-btn{min-width:112px}
.sp-popup .sp-size-row{margin-top:14px}

/* ===== YD 3.33: big UPGRADES button under the spinner, endless upgrades, buy x1 / x10 / MAX ===== */
.sp-cog{position:relative;display:flex;align-items:center;justify-content:center;gap:calc(10px*var(--sps,1));width:100%;height:calc(40px*var(--sps,1));min-height:34px;margin-top:calc(12px*var(--sps,1));padding:0 calc(14px*var(--sps,1));border:1px solid rgba(var(--a),.65);border-radius:calc(6px*var(--sps,1));background:linear-gradient(180deg,rgba(var(--a),.28),rgba(var(--a),.12));color:var(--accent);font:inherit;font-size:calc(13px*var(--sps,1));font-weight:700;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 18px rgba(var(--a),.18);transition:background-color .2s ease,box-shadow .2s ease,transform .12s ease,border-color .2s ease}
.sp-cog:hover{background:linear-gradient(180deg,rgba(var(--a),.42),rgba(var(--a),.2));box-shadow:0 0 26px rgba(var(--a),.4)}
.sp-cog:active{transform:scale(.97)}
.sp-cog-ic{width:calc(18px*var(--sps,1));height:calc(18px*var(--sps,1));min-width:14px;fill:currentColor;flex:none}
.sp-cog-dot{display:none;position:absolute;right:calc(10px*var(--sps,1));top:50%;width:calc(9px*var(--sps,1));height:calc(9px*var(--sps,1));margin-top:calc(-4.5px*var(--sps,1));border-radius:50%;background:var(--warm);box-shadow:0 0 10px var(--warm)}
.sp-cog.can{border-color:var(--warm);animation:spCan 1.6s ease-in-out infinite}
.sp-cog.can .sp-cog-dot{display:block}
@keyframes spCan{0%,100%{box-shadow:0 0 12px rgba(var(--a),.2)}50%{box-shadow:0 0 28px rgba(var(--a),.7)}}
.spinner-widget.pop-on .sp-cog{background:linear-gradient(180deg,rgba(var(--a),.5),rgba(var(--a),.26));border-color:var(--accent)}
.move-mode .sp-cog,body.secondary .sp-cog{display:none}
.sp-buymode{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.sp-buymode button{padding:8px 0;border:1px solid rgba(var(--t),.18);background:rgba(var(--t),.05);color:var(--text);font:inherit;font-size:11px;letter-spacing:.12em;cursor:pointer}
.sp-buymode button:hover{background:rgba(var(--a),.2);border-color:rgba(var(--a),.5)}
.sp-buymode button.on{border-color:rgba(var(--a),.75);background:rgba(var(--a),.24);color:var(--accent)}
.sp-popup .sp-up{margin-bottom:6px}
.sp-popup .sp-up-info b{color:var(--accent)}

/* ===== YD 3.34: turn counter (K / M / B / T) and the "open the spinner in its own window" button ===== */
.sp-foot #spTurns{color:var(--accent);font-variant-numeric:tabular-nums}
body:not(.move-mode) .spinner-widget.sp-popped{visibility:hidden;pointer-events:none}   /* while the spinner lives in its own window the copy on the wallpaper is hidden (one spinner = one set of coins) */
.sp-openwin{margin-top:10px}
.sp-popup .sp-openwin{margin:10px 0 0}

/* ===== YD 3.35: new spinner popup (stats + tabs UPGRADES / SKINS / SETTINGS), 9 upgrades, 6 skins ===== */
.sp-popup{width:430px;padding:0;overflow:hidden;border-radius:16px;border:1px solid rgba(var(--a),.5);background:linear-gradient(180deg,rgba(var(--p),.98),rgba(var(--p),.93));box-shadow:0 26px 90px rgba(0,0,0,.6),0 0 46px rgba(var(--a),.14),inset 0 1px 0 rgba(var(--t),.07)}
.sp-popup.open{display:flex;flex-direction:column;animation:spPopIn .28s cubic-bezier(.2,.9,.25,1) both}
.sp-popup[data-side="r"]{transform-origin:100% 18%}.sp-popup[data-side="l"]{transform-origin:0 18%}.sp-popup[data-side="c"]{transform-origin:50% 100%}
@keyframes spPopIn{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
.sp-pop-head{padding:14px 16px 12px;border-bottom:0;background:linear-gradient(90deg,rgba(var(--a),.18),transparent 75%)}
.sp-pop-title{font-weight:700;letter-spacing:.22em}
.sp-pop-x{width:30px;height:30px;border-radius:9px;transition:background-color .2s ease,transform .25s ease}
.sp-pop-x:hover{transform:rotate(90deg)}
.sp-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 13px}
.sp-stat{min-width:0;padding:8px 10px 9px;border:1px solid rgba(var(--t),.11);border-radius:11px;background:rgba(var(--t),.04)}
.sp-stat small{display:block;font-size:9px;letter-spacing:.2em;color:rgba(var(--t),.5)}
.sp-stat b{display:block;margin-top:4px;font-size:17px;font-weight:700;letter-spacing:.03em;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-stat.coin{border-color:rgba(var(--a),.45);background:linear-gradient(180deg,rgba(var(--a),.18),rgba(var(--a),.06))}
.sp-stat.coin b{font-size:20px;color:var(--warm)}
.sp-tabs{display:flex;padding:0 12px;border-bottom:1px solid rgba(var(--t),.12)}
.sp-tabs button{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 4px 12px;border:0;border-bottom:2px solid transparent;background:none;color:rgba(var(--t),.55);font:inherit;font-size:11px;letter-spacing:.14em;cursor:pointer;transition:color .2s ease,background-color .2s ease,border-color .2s ease}
.sp-tabs button:hover{color:var(--text);background:rgba(var(--t),.04)}
.sp-tabs button.on{color:var(--accent);border-bottom-color:var(--accent);background:linear-gradient(180deg,transparent,rgba(var(--a),.12))}
.sp-tabs button i{display:none;width:7px;height:7px;border-radius:50%;background:var(--warm);box-shadow:0 0 8px var(--warm)}
.sp-tabs button i.on{display:inline-block;animation:spCan 1.6s ease-in-out infinite}
.sp-body{flex:0 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 16px 16px;height:clamp(250px,calc(100vh - 300px),480px);scrollbar-width:thin}
.sp-pane{display:none}.sp-pane.on{display:block;animation:fade .22s ease both}
.sp-buymode{margin-bottom:10px;gap:0;border:1px solid rgba(var(--t),.2);border-radius:10px;overflow:hidden}
.sp-buymode button{padding:8px 0;border:0;border-right:1px solid rgba(var(--t),.14);border-radius:0;background:transparent;color:rgba(var(--t),.7);transition:background-color .2s ease,color .2s ease}
.sp-buymode button:last-child{border-right:0}
.sp-buymode button.on{background:rgba(var(--a),.3);color:var(--accent);font-weight:700}
.sp-grp{display:flex;align-items:center;gap:10px;margin:15px 0 8px;font-size:10px;letter-spacing:.26em;color:rgba(var(--t),.5)}
.sp-grp:first-child{margin-top:2px}
.sp-grp::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(var(--t),.18),transparent)}
.sp-popup .sp-up{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:11px;padding:10px 11px;margin-bottom:7px;border:1px solid rgba(var(--t),.11);border-radius:12px;background:rgba(var(--t),.035);transition:border-color .2s ease,background-color .2s ease,box-shadow .25s ease}
.sp-popup .sp-up.can{border-color:rgba(var(--a),.42);background:rgba(var(--a),.08)}
.sp-popup .sp-up.bought{animation:spBought .65s ease-out}
@keyframes spBought{0%{box-shadow:0 0 0 0 rgba(var(--a),.85);background:rgba(var(--a),.4)}100%{box-shadow:0 0 0 16px rgba(var(--a),0)}}
.sp-up-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--accent);background:rgba(var(--a),.14);border:1px solid rgba(var(--a),.32)}
.sp-up-ic svg{width:21px;height:21px}
.sp-up.maxed .sp-up-ic{color:var(--warm);border-color:var(--warm)}
.sp-up-top{display:flex;align-items:center;gap:8px;min-width:0}
.sp-popup .sp-up-info .sp-up-top b{font-size:12.5px;letter-spacing:.06em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-lv{flex:none;font-style:normal;font-size:9px;letter-spacing:.1em;padding:2px 7px;border-radius:99px;background:rgba(var(--t),.1);color:rgba(var(--t),.78)}
.sp-popup .sp-up-info .sp-up-d{display:block;margin-top:3px;font-size:10.5px;line-height:1.4;color:rgba(var(--t),.5)}
.sp-up-val{margin-top:5px;font-size:11px;line-height:1.4;color:var(--accent);font-variant-numeric:tabular-nums;word-break:break-word}
.sp-up-bar{margin-top:6px;height:3px;border-radius:3px;background:rgba(var(--t),.13);overflow:hidden}
.sp-up-bar i{display:block;height:100%;background:var(--warm);transition:width .3s ease}
.sp-buy{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:98px;padding:7px 10px;border-radius:10px;border:1px solid rgba(var(--t),.18);background:rgba(var(--t),.05);color:rgba(var(--t),.55);font:inherit;cursor:pointer;transition:background-color .2s ease,box-shadow .2s ease,transform .12s ease,border-color .2s ease}
.sp-buy-l{font-size:9px;letter-spacing:.14em;white-space:nowrap}
.sp-buy-p{font-size:13.5px;font-weight:700;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.sp-buy:disabled{cursor:not-allowed;opacity:.6}
.sp-buy:not(:disabled){border-color:var(--accent);background:linear-gradient(180deg,rgba(var(--a),.45),rgba(var(--a),.2));color:var(--text);box-shadow:0 0 14px rgba(var(--a),.25)}
.sp-buy:not(:disabled):hover{box-shadow:0 0 24px rgba(var(--a),.6);transform:translateY(-1px)}
.sp-buy:not(:disabled):active{transform:scale(.96)}
.sp-up.maxed .sp-buy{opacity:1;border-color:var(--warm);color:var(--warm);background:rgba(var(--t),.03)}
.sp-note{margin:0 0 12px;font-size:11px;line-height:1.55;color:rgba(var(--t),.55)}
.sp-skins{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.sp-skin{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;padding:11px 6px 9px;border:1px solid rgba(var(--t),.13);border-radius:13px;background:rgba(var(--t),.04);color:var(--text);font:inherit;cursor:pointer;transition:border-color .2s ease,background-color .2s ease,box-shadow .25s ease,transform .15s ease}
.sp-skin:hover{transform:translateY(-2px);background:rgba(var(--t),.08)}
.sp-skin-pv{width:64px;height:64px;display:grid;place-items:center;border-radius:50%;color:var(--accent);background:radial-gradient(circle,rgba(var(--t),.1),transparent 72%);transition:filter .25s ease}
.sp-skin-pv svg{width:58px;height:58px;overflow:visible}
.sp-skin b{font-size:11.5px;letter-spacing:.1em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-skin small{font-size:10px;letter-spacing:.08em;color:rgba(var(--t),.52);font-variant-numeric:tabular-nums}
.sp-skin-btn{margin-top:5px;min-width:76%;max-width:100%;padding:5px 6px;border-radius:8px;border:1px solid rgba(var(--t),.16);font-size:10px;letter-spacing:.1em;text-align:center;color:rgba(var(--t),.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-skin.lock .sp-skin-pv{filter:grayscale(.9) brightness(.7)}
.sp-skin.lock{opacity:.8}
.sp-skin.can{border-color:var(--warm);animation:spCan 1.6s ease-in-out infinite}
.sp-skin.can .sp-skin-btn{border-color:var(--warm);background:rgba(var(--t),.05);color:var(--warm);font-weight:700}
.sp-skin.own .sp-skin-btn{color:var(--text)}
.sp-skin.on{border-color:var(--accent);background:rgba(var(--a),.16);box-shadow:0 0 20px rgba(var(--a),.32)}
.sp-skin.on .sp-skin-btn{border-color:var(--accent);color:var(--accent);background:rgba(var(--a),.16)}
.sp-popup .sp-type{border-radius:11px}
.sp-popup .size-row{border-radius:11px}
.sp-popup .wide-btn{border-radius:10px}
.sp-popup .sp-body .sp-sub:first-child{margin-top:2px}

/* ===== YD 3.35: skins. The widget gets data-skin="N" (0 = classic = follows the colour theme, 1 neon, 2 gold, 3 crystal, 4 inferno, 5 galaxy; 6-9 and 10-17 are further down) ===== */
.spinner-widget.crit .sp-ring{border-color:var(--warm);box-shadow:0 0 40px var(--warm) inset,0 0 22px var(--warm);transition:none}
.spinner-widget.crit .sp-tip{color:var(--warm);font-weight:700}
/* 1 NEON */
.spinner-widget[data-skin="1"] .sp-arm{background:linear-gradient(90deg,#ff3df0,#2de2ff);box-shadow:0 0 calc(8px + 20px*var(--g)) rgba(255,61,240,calc(.55 + .45*var(--g)))}
.spinner-widget[data-skin="1"] .sp-arm i{border:3px solid #2de2ff;background:#12041f;box-shadow:0 0 calc(8px + 12px*var(--g)) #2de2ff,inset 0 0 8px rgba(45,226,255,.7)}
